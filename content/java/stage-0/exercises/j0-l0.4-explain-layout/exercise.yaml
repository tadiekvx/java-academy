id: j0-l0.4-explain-layout
type: explain
title: "Read the layout"
lesson: j0-l0.4
role: ladder
assesses: [o2]
concepts: [J0.01]
evidence: [EXPL]
misconceptions: []
difficulty: 2
prompt: |
  Here is a project's layout:

  ```
  shop/
    src/
      Main.java
      Basket.java
    out/
      Main.class
      Basket.class
  ```

  Which file would you run to start the program, and how do you know? Where is the code you edit, and what is in the `out` folder? A colleague has been editing `out/Basket.class`: what should they do instead, and why?
rubric:
  criteria: |
    A full answer says Main.java is run because it holds main (the starting point); the editable source is in src; out holds compiled class files generated by the IDE; edit the .java source in src, because the class files are regenerated when the project is compiled.
  levels:
    - score: 2
      descriptor: "Says Main.java is the one to run (it has main), the source in src is what you edit, out holds generated compiled class files, and the colleague should edit the .java in src because out is overwritten on compile."
      samples:
        - "I'd run Main.java because it has the main method. The code I edit is in src; out has the compiled .class files, which the IDE generates. The colleague should edit Basket.java in src, since out gets regenerated and their changes would be lost."
        - "Main.java is the entry point. src is source, out is compiled output. They shouldn't edit a .class file, but the .java in src, because the IDE recompiles and replaces the output."
    - score: 1
      descriptor: "Gets part of it: identifies Main.java, or says edit src, but misses why the output folder shouldn't be edited."
      samples:
        - "Run Main.java."
        - "They should edit src instead."
    - score: 0
      descriptor: "Incorrect, for example says to edit the class files, or that out holds the source."
      samples:
        - "Edit the class files in out."
        - "out is where the source is."
ai_assisted: true
