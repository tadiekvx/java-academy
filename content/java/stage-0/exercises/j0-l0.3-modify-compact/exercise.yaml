    - {name: "uses IO", source_contains: ["IO.println"]}
hints:
  h1: "Remove the class wrapper and the old main header, then swap System.out.println for IO.println."
  h2: "void main() { IO.println(\"Total: \" + (2 + 3)); IO.println(\"Done\"); }"
ai_assisted: true
