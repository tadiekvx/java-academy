        title: Values and variables
        lessons:
          - {id: j1-l2.1, title: Values and types, concepts: [J1.02]}
          - {id: j1-l2.2, title: Variables and state, concepts: [J1.03]}
          - {id: j1-l2.3, title: "Arithmetic: division, remainders and exact results", concepts: [J1.02]}
          - {id: j1-l2.4, title: Working with strings, concepts: [J1.04]}
      - number: 3
        title: Input and decisions
        lessons:
          - {id: j1-l3.1, title: Reading input, concepts: [J1.05]}
          - {id: j1-l3.2, title: Boolean expressions, concepts: [J1.06]}
          - {id: j1-l3.3, title: Making decisions, concepts: [J1.06]}
          - {id: j1-l3.4, title: switch expressions, concepts: [J1.06]}
      - number: 4
        title: Repetition
        lessons:
          - {id: j1-l4.1, title: while loops, concepts: [J1.07]}
          - {id: j1-l4.2, title: Tracing loops, concepts: [J1.07]}
