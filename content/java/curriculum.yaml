      - number: 5
        title: Methods
        lessons:
          - {id: j1-l5.1, title: Defining and calling methods, concepts: [J1.08]}
          - {id: j1-l5.2, title: Parameters and return values, concepts: [J1.08]}
          - {id: j1-l5.3, title: Scope and the call stack, concepts: [J1.08]}
          - {id: j1-l5.4, title: Decomposing problems, concepts: [J1.09]}
          - {id: j1-l5.5, title: Reading tests, concepts: [J1.14]}
