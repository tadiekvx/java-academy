        title: Working with data
        lessons:
          - {id: j1-l6.1, title: Arrays, concepts: [J1.10]}
          - {id: j1-l6.2, title: Array algorithms and references, concepts: [J1.10]}
          - {id: j1-l6.3, title: ArrayList, concepts: [J1.11]}
          - {id: j1-l6.4, title: Exceptions and stack traces, concepts: [J1.12]}
          - {id: j1-l6.5, title: Debugging systematically, concepts: [J1.13]}
      - number: 7
        title: Whole programs
        lessons:
          - {id: j1-l7.1, title: Reading a program you didn't write, concepts: [J1.15]}
          - {id: j1-l7.2, title: From requirements to a plan, concepts: [J1.16, J1.09]}
          - {id: j1-l7.3, title: Writing your own checks, concepts: [J1.14]}
          - {id: j1-l7.4, title: Mixed-skills challenges, concepts: [J1.16, J1.07, J1.08]}
  - number: 2
    title: "Object-oriented programming"
    modules:
      - number: 1
        title: "Classes and objects"
        lessons:
          - {id: j2-l1.1, title: "From main to a class", concepts: [J2.01]}
          - {id: j2-l1.2, title: "Methods and this", concepts: [J2.02]}
          - {id: j2-l1.3, title: "Objects and references", concepts: [J2.03]}
          - {id: j2-l1.4, title: "static, toString and equals", concepts: [J2.04]}
      - number: 2
