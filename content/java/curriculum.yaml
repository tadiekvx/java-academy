misconceptions:
  - {id: MC01, concepts: [J1.03], source: R8, summary: "= is read as mathematical equality, or as symmetric (a = b same as b = a)"}
  - {id: MC02, concepts: [J1.03], source: R8, summary: A variable can hold several values at once or remembers earlier values}
  - {id: MC03, concepts: [J1.03], source: R8, summary: "After b = a;, changing a also changes b (for primitives)"}
  - {id: MC04, concepts: [J1.02], source: Platform, summary: "Integer division keeps the fraction (7 / 2 is 3.5); 1 / 2 * x is x / 2"}
  - {id: MC05, concepts: [J1.04], source: R9, summary: Strings are compared with ==}
  - {id: MC06, concepts: [J1.04, J1.08], source: R9, summary: Calling a non-void method changes something even when its result is ignored}
  - {id: MC07, concepts: [J1.08], source: R8, summary: Printing a value is the same as returning it}
  - {id: MC08, concepts: [J1.06, J1.07], source: R9, summary: A semicolon after an if/while header is harmless}
  - {id: MC09, concepts: [J1.07, J1.10], source: R8, summary: "Loop bounds and indices are off by one (i <= arr.length)"}
  - {id: MC10, concepts: [J1.07], source: R8, summary: A while loop exits the moment its condition becomes false mid-body}
  - {id: MC11, concepts: [J1.06], source: R8, summary: In an if / else if chain every matching branch runs}
  - {id: MC12, concepts: [J1.10], source: R8, summary: Assigning an array to another variable copies it}
  - {id: MC13, concepts: [J1.08], source: R8, summary: "Changing a primitive parameter inside a method changes the caller's variable"}
  - {id: MC14, concepts: [J1.06], source: R9, summary: "& / | and && / || are interchangeable"}
  - {id: MC15, concepts: [J1.12], source: Platform, summary: "The first line of a stack trace always points at the learner's own code"}
  - {id: MC16, concepts: [J1.15], source: R8, summary: "A method does what its name says, so the body need not be read"}
  - {id: MC17, concepts: [J1.15], source: Platform, summary: "Unfamiliar code is best fixed by rewriting it rather than by understanding it first"}
  - {id: MC18, concepts: [J1.16], source: R8, summary: "Typing code first is faster than restating the requirement and planning cases"}
  - {id: MC19, concepts: [J1.16], source: Platform, summary: "A method that works for a typical input works for the edge inputs too"}
  - {id: MC20, concepts: [J1.16], source: Platform, summary: "Building input, calculation and output all at once is easier to debug than building the calculation first"}
  - {id: MC21, concepts: [J1.14], source: Platform, summary: "The expected value in a check can be copied from what the code returns"}
  - {id: MC22, concepts: [J1.14], source: Platform, summary: "Testing the middle of a range is enough to show a boundary rule is right"}
  - {id: MC23, concepts: [J1.14], source: Platform, summary: "A failing check always means the method is wrong"}
  - {id: MC24, concepts: [J1.16], source: Platform, summary: "A loop that groups consecutive items needs no step after the loop for the final group"}
  - {id: MC25, concepts: [J1.16], source: Platform, summary: "A running maximum can safely start at 0"}
  - {id: MC26, concepts: [J1.16], source: Platform, summary: "The smallest input (empty, zero) rarely needs checking"}
  - {id: MC27, concepts: [J2.01], source: R8, summary: "A class and an object are the same thing (Student.name instead of s.name)"}
  - {id: MC28, concepts: [J2.01], source: Platform, summary: "name = name; in a constructor sets the field"}
  - {id: MC29, concepts: [J2.01], source: R8, summary: "An object field of type String starts as an empty string"}
  - {id: MC30, concepts: [J2.02], source: R8, summary: "Each method call gets its own copy of the object's fields"}
  - {id: MC31, concepts: [J2.02], source: R8, summary: "A method called on one object can change a different object of the same class"}
  - {id: MC32, concepts: [J2.03], source: R8, summary: "Player b = a; makes a separate copy of the object"}
  - {id: MC33, concepts: [J2.03], source: R8, summary: "== on objects compares their contents"}
  - {id: MC34, concepts: [J2.03], source: Platform, summary: "Object-typed fields start with a usable value, not null"}
  - {id: MC35, concepts: [J2.04], source: I38, summary: "Overriding equals without hashCode is fine"}
  - {id: MC36, concepts: [J2.04], source: Platform, summary: "A static field is a good place for each object's own data"}
  - {id: MC37, concepts: [J2.04], source: Platform, summary: "equals(Point other) overrides equals"}
  - {id: MC38, concepts: [J2.05], source: Platform, summary: "A private field is enough to protect an invariant, with no check in the constructor"}
  - {id: MC39, concepts: [J2.05], source: Platform, summary: "Validating in the setter protects the class even while the field is public"}
  - {id: MC40, concepts: [J2.05], source: Platform, summary: "A getter and setter for every field is the same as encapsulation"}
  - {id: MC41, concepts: [J2.06], source: R8, summary: "A final field or variable makes the whole object it refers to unchangeable"}
  - {id: MC42, concepts: [J2.06], source: Platform, summary: "Copying a list in the constructor is enough, even if a getter returns the internal list"}
  - {id: MC43, concepts: [J2.07], source: Platform, summary: "An implementing method can be package-private (no public)"}
  - {id: MC44, concepts: [J2.07], source: R8, summary: "The declared type of a variable decides which version of a method runs"}
  - {id: MC45, concepts: [J2.08], source: R8, summary: "A child constructor runs before its parent's"}
  - {id: MC46, concepts: [J2.08], source: Platform, summary: "A method with the same name but different parameters overrides the parent's"}
  - {id: MC47, concepts: [J2.09], source: Platform, summary: "Inheritance is the right way to reuse another class's code"}
  - {id: MC48, concepts: [J2.09], source: Platform, summary: "If something is-a thing in the real world, the classes should inherit"}
  - {id: MC49, concepts: [J2.10], source: Platform, summary: "Record accessors are named getX()"}
  - {id: MC50, concepts: [J2.10], source: Platform, summary: "Strings are as good as an enum for a fixed set of options"}
  - {id: MC51, concepts: [J2.10], source: R8, summary: "An array or list inside a record cannot change because the record is immutable"}
  - {id: MC52, concepts: [J2.11], source: Platform, summary: "Adding default to a switch over a sealed type is the safe thing to do"}
  - {id: MC53, concepts: [J2.11], source: Platform, summary: "The order of cases in a pattern switch does not matter"}
  - {id: MC54, concepts: [J2.12], source: Platform, summary: "Wrapping a whole method in catch (Exception e) is a safe way to make it robust"}
  - {id: MC55, concepts: [J2.12], source: Platform, summary: "An empty catch block is harmless"}
  - {id: MC56, concepts: [J2.12], source: R8, summary: "Lines after the throwing statement in a try block still run"}
  - {id: MC57, concepts: [J2.13], source: Platform, summary: "When wrapping an exception, the original can be dropped"}
  - {id: MC58, concepts: [J2.13], source: Platform, summary: "Every custom exception should be a checked exception"}
  - {id: MC59, concepts: [J2.14], source: Platform, summary: "A resource only needs closing on the success path"}
  - {id: MC60, concepts: [J2.14], source: Platform, summary: "Catching low down, printing and returning a default is good error handling"}
  - {id: MC61, concepts: [J2.14], source: Platform, summary: "try-with-resources closes resources in the order they are written"}
  - {id: MC62, concepts: [J3.01], source: I41, summary: "A HashSet keeps items in the order they were added"}
  - {id: MC63, concepts: [J3.01], source: R8, summary: "list.remove(1) on a List of Integer removes the value 1"}
  - {id: MC64, concepts: [J3.02], source: Platform, summary: "map.get(key) returns 0 for a missing key"}
  - {id: MC65, concepts: [J3.02], source: I30, summary: "A HashMap iterates in the order keys were put"}
  - {id: MC66, concepts: [J3.02], source: I38, summary: "A key object can be changed after it has been put in a HashMap"}
  - {id: MC67, concepts: [J3.03], source: I31, summary: "Removing from a list inside a for-each over it is fine"}
  - {id: MC68, concepts: [J3.03], source: I29, summary: "A list made with List.of can be added to"}
  - {id: MC69, concepts: [J3.03], source: Platform, summary: "Version numbers can be compared as text"}
  - {id: MC70, concepts: [J3.04], source: I52, summary: "A primitive such as int can be used as a type argument"}
  - {id: MC71, concepts: [J3.04], source: I52, summary: "Generic type arguments are still known at run time"}
  - {id: MC72, concepts: [J3.05], source: Platform, summary: "A lambda can change a local variable of the method around it"}
  - {id: MC73, concepts: [J3.05], source: I53, summary: "A lambda can be assigned to any type, such as Object"}
  - {id: MC74, concepts: [J3.06], source: I50, summary: "A stream can be used again after a terminal operation"}
  - {id: MC75, concepts: [J3.06], source: I50, summary: "filter and map run as soon as they are written, without a terminal operation"}
  - {id: MC76, concepts: [J3.07], source: I35, summary: "Calling get() on an Optional is always safe"}
  - {id: MC77, concepts: [J3.07], source: Platform, summary: "A stream is always clearer than a loop"}
  - {id: MC78, concepts: [J3.08], source: I54, summary: "Writing to a file with Files.writeString adds to what is there"}
  - {id: MC79, concepts: [J3.08], source: Platform, summary: "Reading an empty file gives one empty line, or null"}
  - {id: MC80, concepts: [J3.09], source: I49, summary: "split(\",\") keeps empty fields at the end of a line"}
  - {id: MC81, concepts: [J3.09], source: Platform, summary: "Input files are always tidy and well-formed"}
  - {id: MC82, concepts: [J3.10], source: I44, summary: "plusHours(24) and plusDays(1) always give the same clock time"}
  - {id: MC83, concepts: [J3.10], source: I33, summary: "A LocalDateTime identifies a single moment in time"}
  - {id: MC84, concepts: [J3.10], source: Platform, summary: "mm in a date pattern means the month"}
  - {id: MC85, concepts: [J3.11], source: Platform, summary: "double is fine for money if you print two decimal places"}
  - {id: MC86, concepts: [J3.11], source: I48, summary: "BigDecimal.equals ignores the scale, so 2.0 equals 2.00"}
  - {id: MC87, concepts: [J3.11], source: Platform, summary: "BigDecimal.divide always works without a scale or rounding mode"}
  - {id: MC88, concepts: [J3.12], source: Platform, summary: "Building a large string with += in a loop is efficient"}
  - {id: MC89, concepts: [J3.12], source: I28, summary: "A text block keeps all the indentation of the source code"}
  - {id: MC90, concepts: [J5.01], source: Platform, summary: "One visible loop means linear time, whatever its body calls"}
  - {id: MC91, concepts: [J5.01], source: Platform, summary: "Big-O is the exact running time of the code"}
  - {id: MC92, concepts: [J5.01], source: Platform, summary: "A lower growth rate is always the better choice, even for tiny n"}
  - {id: MC93, concepts: [J5.02], source: I60, summary: "One timing of one run shows which version is faster"}
  - {id: MC94, concepts: [J5.02], source: I58, summary: "A List is a good choice for repeated membership tests"}
  - {id: MC95, concepts: [J5.02], source: R16, summary: "Optimise first, then measure"}
  - {id: MC96, concepts: [J5.03], source: I58, summary: "Growing an array by a fixed amount each time is just as efficient as doubling"}
  - {id: MC97, concepts: [J5.03], source: Platform, summary: "An index inside the array's length is a valid index for the list"}
  - {id: MC98, concepts: [J5.03], source: Platform, summary: "An array is full when size is greater than its length"}
  - {id: MC99, concepts: [J5.04], source: R8, summary: "Overwriting a node's next link and then following it still reaches the rest of the list"}
  - {id: MC100, concepts: [J5.04], source: Platform, summary: "A linked list's head is never null, so head.next is always safe"}
  - {id: MC101, concepts: [J5.04], source: I58, summary: "get(i) on a linked list is as fast as on an array list"}
  - {id: MC102, concepts: [J5.05], source: I55, summary: "Stack and LinkedList are the right classes for a stack and a queue"}
  - {id: MC103, concepts: [J5.05], source: Platform, summary: "A bracket check is finished when the last character has been read, even if openers remain"}
  - {id: MC104, concepts: [J5.05], source: Platform, summary: "In postfix, the first value popped is the left operand of - and /"}
  - {id: MC105, concepts: [J5.06], source: I38, summary: "Two keys with equal hash codes are equal keys"}
  - {id: MC106, concepts: [J5.06], source: Platform, summary: "When a hash table resizes, entries can stay in the same bucket indexes"}
  - {id: MC107, concepts: [J5.06], source: Platform, summary: "hashCode % length is always a valid bucket index"}
  - {id: MC108, concepts: [J5.07], source: Platform, summary: "Setting node.left = new Node(v) inserts the value into the tree"}
  - {id: MC109, concepts: [J5.07], source: I42, summary: "A binary search tree always gives O(log n) lookups"}
  - {id: MC110, concepts: [J5.07], source: Platform, summary: "A tree always has a root node, so root.value is safe"}
  - {id: MC111, concepts: [J5.08], source: I56, summary: "A for-each loop over a PriorityQueue visits items in sorted order"}
  - {id: MC112, concepts: [J5.08], source: Platform, summary: "The array behind a heap is sorted"}
  - {id: MC113, concepts: [J5.08], source: Platform, summary: "When sifting down, a value swaps with either child"}
  - {id: MC114, concepts: [J5.09], source: I60, summary: "A recursive method works without a base case"}
  - {id: MC115, concepts: [J5.09], source: Platform, summary: "A recursive call on the same argument eventually stops"}
  - {id: MC116, concepts: [J5.09], source: R8, summary: "Statements after a recursive call run before the call returns"}
  - {id: MC117, concepts: [J5.10], source: Platform, summary: "A binary search loop can use low < high without missing the last candidate"}
  - {id: MC118, concepts: [J5.10], source: Platform, summary: "Setting low = mid is a safe way to move on after checking the middle"}
  - {id: MC119, concepts: [J5.10], source: I57, summary: "Binary search gives a sensible answer on unsorted data"}
  - {id: MC120, concepts: [J5.10], source: I57, summary: "The first match found by binary search is the first occurrence"}
  - {id: MC121, concepts: [J5.11], source: Platform, summary: "A graph search needs no visited record"}
  - {id: MC122, concepts: [J5.11], source: Platform, summary: "Depth-first search finds the fewest hops"}
  - {id: MC123, concepts: [J5.11], source: Platform, summary: "An undirected edge only needs adding to one of its two nodes"}
  - {id: MC124, concepts: [J5.12], source: Platform, summary: "BFS finds the cheapest path in a weighted graph"}
  - {id: MC125, concepts: [J5.12], source: Platform, summary: "Dijkstra's algorithm works when some edge weights are negative"}
  - {id: MC126, concepts: [J5.12], source: I56, summary: "A node is only ever queued once in Dijkstra's algorithm"}
  - {id: MC127, concepts: [J5.13], source: Platform, summary: "Taking the largest coin that fits always gives the fewest coins"}
  - {id: MC128, concepts: [J5.13], source: Platform, summary: "Filling a memo array speeds up recursion even if it is never read"}
  - {id: MC129, concepts: [J5.13], source: Platform, summary: "In a minimum-coins table an impossible amount can be recorded as 0"}
  - {id: MC130, concepts: [J4.01], source: I61, summary: "git add saves a change permanently into the history"}
  - {id: MC131, concepts: [J4.01], source: I62, summary: "A branch is a full copy of the project's files"}
  - {id: MC132, concepts: [J4.01], source: Platform, summary: "A commit message such as 'fix' or 'update' is good enough"}
  - {id: MC133, concepts: [J4.02], source: I62, summary: "A file with conflict markers can be committed as it is"}
  - {id: MC134, concepts: [J4.02], source: Platform, summary: "Resetting or amending commits that others have pulled is safe"}
  - {id: MC135, concepts: [J4.02], source: I64, summary: "git fetch updates the branch you are on"}
  - {id: MC136, concepts: [J4.03], source: I67, summary: "Tests can live in src/main/java and still be run by Maven"}
  - {id: MC137, concepts: [J4.03], source: Platform, summary: "The target directory should be committed to version control"}
  - {id: MC138, concepts: [J4.03], source: I66, summary: "A testing library doesn't need a test scope"}
  - {id: MC139, concepts: [J4.04], source: R16, summary: "The generic advice at the end of Maven's output is the part to read first"}
  - {id: MC140, concepts: [J4.04], source: I65, summary: "A jar is still built when a test fails"}
  - {id: MC141, concepts: [J4.04], source: I66, summary: "Declaring a library at a different version than another library needs is harmless"}
  - {id: MC142, concepts: [J4.05], source: Platform, summary: "The expected value of a test can be taken from running the code"}
  - {id: MC143, concepts: [J4.05], source: R16, summary: "Testing typical values is enough to find boundary bugs"}
  - {id: MC144, concepts: [J4.05], source: Platform, summary: "If all tests pass, the code is correct"}
  - {id: MC145, concepts: [J4.06], source: I68, summary: "A test suite only needs to cover valid input"}
  - {id: MC146, concepts: [J4.06], source: Platform, summary: "A test that depends on the real clock or random numbers is fine if it usually passes"}
  - {id: MC147, concepts: [J4.06], source: Platform, summary: "A test that runs the code and prints the result is a good test"}
  - {id: MC148, concepts: [J4.07], source: Platform, summary: "Logging everything at one level is fine"}
  - {id: MC149, concepts: [J4.07], source: Platform, summary: "It is fine to log passwords or personal data while investigating"}
  - {id: MC150, concepts: [J4.07], source: R16, summary: "Once the first fault is fixed, the method is correct"}
  - {id: MC151, concepts: [J4.08], source: Platform, summary: "A method can be refactored safely without any tests"}
  - {id: MC152, concepts: [J4.08], source: Platform, summary: "Fixing a bug and refactoring in the same step is efficient and safe"}
  - {id: MC153, concepts: [J4.08], source: R16, summary: "One large rewrite tested at the end is the quickest safe way to improve code"}
  - {id: MC154, concepts: [J4.09], source: Platform, summary: "A review comment such as 'messy' is useful feedback"}
  - {id: MC155, concepts: [J4.09], source: Platform, summary: "Every code smell must be fixed immediately"}
  - {id: MC156, concepts: [J4.09], source: Platform, summary: "Review comments should be accepted or rejected without discussion"}
  - {id: MC157, concepts: [J6.02], source: I69, summary: "SQL uses three-valued logic, so `city = NULL` compares against the unknown value and never becomes true"}
  - {id: MC158, concepts: [J6.03], source: I72, summary: "A many-to-many relationship is modelled by repeating one entity's column instead of joining through a junction table"}
  - {id: MC159, concepts: [J6.06], source: I70, summary: "A transaction commits after every statement, so a multi-step change can be saved partially"}
  - {id: MC160, concepts: [J6.05], source: I69, summary: "A foreign key is placed on the parent table of a one-to-many relationship"}
  - {id: MC161, concepts: [J6.08], source: I82, summary: "SQL injection is stopped by escaping quotes inside the query string"}
  - {id: MC162, concepts: [J6.10], source: I76, summary: "A JDBC connection is closed by the database server only when the application closes it"}
  - {id: MC163, concepts: [J6.11], source: I80, summary: "An ORM entity must be saved with an explicit update call after every change"}
  - {id: MC164, concepts: [J6.12], source: I80, summary: "Lazy loading is free because the data is only read when it is used"}
  - {id: MC165, concepts: [J6.13], source: I80, summary: "An ORM should be used for every query, including reports that total many rows"}
  - {id: MC166, concepts: [J7.01], source: I84, summary: "A response status code is part of the body, so a client has to read the body to know whether a request worked"}
  - {id: MC167, concepts: [J7.02], source: I84, summary: "POST and PUT are interchangeable ways to save data, so a client may retry either one freely"}
  - {id: MC168, concepts: [J7.03], source: I84, summary: "Any failure can be reported as 200 with an error message in the body, or as a generic 500"}
  - {id: MC169, concepts: [J7.04], source: I84, summary: "A URL names an action, so an API should have addresses like /getAccount and /deleteAccount"}
  - {id: MC170, concepts: [J7.05], source: I86, summary: "A class should create its own collaborators with new, because that keeps the code simple and easy to test"}
  - {id: MC171, concepts: [J7.06], source: I87, summary: "A Spring singleton bean is the same as the singleton design pattern, so it is safe to keep per-user state in its fields"}
  - {id: MC172, concepts: [J7.07], source: I89, summary: "Auto-configuration is magic that cannot be changed; to customise anything you must edit the framework's configuration"}
  - {id: MC173, concepts: [J7.08], source: I91, summary: "A controller method must build the whole HTTP response itself, including converting objects to JSON"}
  - {id: MC174, concepts: [J7.09], source: I92, summary: "Validating in the controller with if statements is the same as declaring constraints, so there is nothing to gain from a framework"}
  - {id: MC175, concepts: [J7.10], source: I91, summary: "Pages are numbered from 1 everywhere, and a page request beyond the data is an error"}
  - {id: MC176, concepts: [J7.11], source: I93, summary: "Every Spring test should start the whole application context, because that is the only realistic test"}
  - {id: MC177, concepts: [J7.12], source: I93, summary: "A test with mocked collaborators proves the whole feature works"}
  - {id: MC178, concepts: [J8.01], source: I95, summary: "Security is a checklist applied at the end; a feature that passes its tests is secure"}
  - {id: MC179, concepts: [J8.02], source: I96, summary: "Hashing a password with SHA-256 is enough, because a hash cannot be reversed"}
  - {id: MC180, concepts: [J8.03], source: I97, summary: "Validating input on the way in makes it safe to put into any output"}
  - {id: MC181, concepts: [J8.04], source: I98, summary: "A secret in a private repository or in a log line is safe because only the team can see it"}
  - {id: MC182, concepts: [J8.05], source: I101, summary: "Every cookie should be hidden from scripts with HttpOnly, so a single-page app can never read any cookie"}
  - {id: MC183, concepts: [J8.06], source: I100, summary: "A signed JWT cannot be abused: the signature makes its contents secret and it can be revoked at any time"}
  - {id: MC184, concepts: [J8.07], source: I104, summary: "If a user is logged in, an endpoint may return any record whose id they ask for"}
  - {id: MC185, concepts: [J8.08], source: I102, summary: "CSRF protection and CORS are the same control, so enabling one makes the other unnecessary"}
  - {id: MC186, concepts: [J8.09], source: I105, summary: "A login error should say exactly what was wrong, so honest users are helped"}
  - {id: MC187, concepts: [J9.01], source: I116, summary: "Starting a thread and then reading its result right away is fine, because the thread will have finished by then"}
  - {id: MC188, concepts: [J9.02], source: I111, summary: "If a concurrent program passed its tests, it has no race; a race always shows up as a crash"}
  - {id: MC189, concepts: [J9.03], source: I116, summary: "synchronized on any object protects the data, so a new lock object per call is fine"}
  - {id: MC190, concepts: [J9.04], source: I111, summary: "volatile makes compound operations such as count++ atomic"}
  - {id: MC191, concepts: [J9.05], source: I111, summary: "A deadlock is a slow program; it will finish if you wait long enough"}
  - {id: MC192, concepts: [J9.06], source: I112, summary: "Creating a new Thread for every task is the normal way to run many tasks; an executor adds nothing"}
  - {id: MC193, concepts: [J9.07], source: I114, summary: "A concurrent map makes any sequence of its operations atomic, including contains-then-put"}
  - {id: MC194, concepts: [J9.08], source: I108, summary: "Virtual threads make CPU-bound code faster, and should be pooled like platform threads"}
  - {id: MC195, concepts: [J9.09], source: I115, summary: "Setting a variable to null frees the object immediately, and a memory leak is impossible in a garbage-collected language"}
  - {id: MC196, concepts: [J9.10], source: I116, summary: "The first timing of a Java method is its true speed, so one measurement is enough"}
  - {id: MC197, concepts: [J9.11], source: I116, summary: "The slow-looking code is the slow code; profiling is only needed when the fix did not work"}
  - {id: MC198, concepts: [J10.01], source: I117, summary: "Layers are only folders; a lower layer may freely call back up to a higher one when that is convenient"}
  - {id: MC199, concepts: [J10.02], source: I117, summary: "A port is a framework feature; the domain code needs to know which database or web framework is outside it"}
  - {id: MC200, concepts: [J10.03], source: I118, summary: "Microservices are the modern default, so a new system should start as many small services"}
  - {id: MC201, concepts: [J10.04], source: I120, summary: "If a remote call times out, it did not happen, so retrying immediately and without limit is safe"}
  - {id: MC202, concepts: [J10.05], source: I120, summary: "A retried request is harmless as long as the server returns an error to the second copy"}
  - {id: MC203, concepts: [J10.06], source: I121, summary: "A transaction across two services can simply be wrapped in one database transaction"}
  - {id: MC204, concepts: [J10.07], source: I123, summary: "A circuit breaker makes a failing dependency work again; it only hides failures"}
  - {id: MC205, concepts: [J11.01], source: I126, summary: "A container is a small virtual machine with its own operating system kernel"}
  - {id: MC206, concepts: [J11.02], source: I126, summary: "A smaller image only matters for download speed; what the build leaves in the final image is not a concern"}
  - {id: MC207, concepts: [J11.03], source: I137, summary: "Putting the database password into the image or the Compose file in the repository is fine because it is only for development"}
  - {id: MC208, concepts: [J11.04], source: I129, summary: "Setting a container memory limit makes the JVM size its heap to that limit; an out-of-memory exit always means the heap is too small"}
  - {id: MC209, concepts: [J11.05], source: I130, summary: "A pipeline is a list of scripts that all run whether or not an earlier one failed"}
  - {id: MC210, concepts: [J11.06], source: I130, summary: "A deployment that passed its tests cannot fail in production, so rollback is only for emergencies"}
  - {id: MC211, concepts: [J11.07], source: I132, summary: "Opening a port to 0.0.0.0/0 is fine while testing because nobody knows the address"}
  - {id: MC212, concepts: [J11.07], source: I131, summary: "A service account with broad permissions is simpler and just as safe, because only our code uses it"}
  - {id: MC213, concepts: [J11.08], source: I131, summary: "Cloud resources cost nothing until traffic arrives, so leaving them running is free"}
  - {id: MC214, concepts: [J12.01], source: I125, summary: "Logs, metrics and traces are three names for the same thing, so one of them is enough"}
  - {id: MC215, concepts: [J12.02], source: I124, summary: "The average latency tells you how users experience the service, so it is the right number for an objective"}
  - {id: MC216, concepts: [J12.03], source: I125, summary: "A slow request is slow in its root span, so the root span's duration shows where to look"}
  - {id: MC217, concepts: [J12.04], source: I124, summary: "During an incident the first job is to find the root cause and fix the code"}
  - {id: MC218, concepts: [J12.05], source: I133, summary: "Renaming a database column is one safe step: change the column and deploy the code together"}
  - {id: MC219, concepts: [J12.06], source: I135, summary: "To work safely on legacy code, first clean it up; tests can come later"}
  - {id: MC220, concepts: [J12.07], source: I136, summary: "An estimate is a promise of one number, and a design review is a check that the author is right"}

stages:
  - number: 0
    title: Your own machine
    optional: true
    modules:
      - number: 0
        title: Running Java outside the browser
        lessons:
          - {id: j0-l0.1, title: What Java is made of, concepts: [J0.01]}
          - {id: j0-l0.2, title: Installing a JDK and checking it, concepts: [J0.01]}
          - {id: j0-l0.3, title: Running Java from the terminal, concepts: [J0.01]}
          - {id: j0-l0.4, title: Your first IDE project, concepts: [J0.01]}
  - number: 1
    title: Programming foundations in Java
    modules:
      - number: 1
        title: First programs
        lessons:
          - {id: j1-l1.1, title: Your first program, concepts: [J1.01]}
          - {id: j1-l1.2, title: Errors are feedback, concepts: [J1.01, J1.13]}
