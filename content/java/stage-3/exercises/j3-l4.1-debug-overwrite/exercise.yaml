id: j3-l4.1-debug-overwrite
type: debug
title: "Only the last line survives"
lesson: j3-l4.1
role: ladder
assesses: [o3]
concepts: [J3.08]
evidence: [DEBUG]
misconceptions: []
difficulty: 3
prompt: |
  `roundTrip` saves some lines and loads them back, but only the **last** line comes back. Find out why, and fix `save` so that all the lines are kept (in order).
entry:
  methods:
    - {name: roundTrip, params: [{name: lines, type: "List<String>"}], returns: "String"}
tests:
  visible:
    - {method: roundTrip, args: [["a", "b", "c"]], expect: "a|b|c"}
    - {method: roundTrip, args: [[]], expect: ""}
    - {method: roundTrip, args: [["only"]], expect: "only"}
  hidden:
    - {method: roundTrip, args: [["x", "y"]], expect: "x|y"}
    - {method: roundTrip, args: [["one", "two", "three", "four"]], expect: "one|two|three|four"}
    - {method: roundTrip, args: [["café", "thé"]], expect: "café|thé"}
    - {method: roundTrip, args: [["a", "", "b"]], expect: "a||b"}
    - {method: roundTrip, args: [["last", "first"]], expect: "last|first"}
hints:
  h1: "What does Files.writeString do to a file that already has content? What happens on the second line?"
  h2: "Write all the lines in one call: Files.write(path, lines);"
ai_assisted: true
