id: j1-l6.2-write-reverse
type: write
title: "Reverse a copy"
lesson: j1-l6.2
role: ladder
assesses: [o1, o3]
concepts: [J1.10]
evidence: [IMPL]
misconceptions: []
difficulty: 3
variant_group: array-algorithms
prompt: |
  Write a method called `reversed` that is given an `int[]` called `values` and returns a **new** array with the elements in reverse order. It must leave the original array unchanged.
entry:
  methods:
    - {name: reversed, params: [{name: values, type: "int[]"}], returns: "int[]"}
tests:
  visible:
    - {args: [[1, 2, 3]], expect: [3, 2, 1]}
    - {args: [[]], expect: []}
    - {args: [[7]], expect: [7]}
  hidden:
    - {name: "two", args: [[1, 2]], expect: [2, 1]}
    - {name: "even length", args: [[1, 2, 3, 4]], expect: [4, 3, 2, 1]}
    - {name: "all same", args: [[5, 5, 5]], expect: [5, 5, 5]}
    - {name: "negatives", args: [[-1, 0, 1]], expect: [1, 0, -1]}
    - {name: "five", args: [[9, 8, 7, 6, 5]], expect: [5, 6, 7, 8, 9]}
starter_compiles: false
hints:
  h1: "Copy first, so the original is safe. Then swap pairs working inwards from both ends."
  h2: "Swap copy[i] with copy[length - 1 - i] for i from 0 to length / 2."
ai_assisted: true
