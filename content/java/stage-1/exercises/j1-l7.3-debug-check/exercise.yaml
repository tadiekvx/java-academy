id: j1-l7.3-debug-check
type: debug
title: "A check that cannot be trusted"
lesson: j1-l7.3
role: ladder
assesses: [o3, o1]
concepts: [J1.14]
evidence: [DEBUG]
misconceptions: []
difficulty: 2
prompt: |
  This check helper has two bugs, so it reports wrong results. Find them and fix them so that `check("sum", 5, 6)` returns `FAIL sum: expected 5 but got 6` and `check("sum", 5, 5)` returns `PASS sum`.
entry:
  methods:
    - {name: check, params: [{name: name, type: "String"}, {name: expected, type: "int"}, {name: actual, type: "int"}], returns: "String"}
tests:
  visible:
    - {method: check, args: ["sum", 5, 5], expect: "PASS sum"}
    - {method: check, args: ["sum", 5, 6], expect: "FAIL sum: expected 5 but got 6"}
    - {method: check, args: ["zero", 0, 0], expect: "PASS zero"}
  hidden:
    - {method: check, args: ["negative", -3, -3], expect: "PASS negative"}
    - {method: check, args: ["big", 1000, 999], expect: "FAIL big: expected 1000 but got 999"}
    - {method: check, args: ["a b", 7, 8], expect: "FAIL a b: expected 7 but got 8"}
    - {method: check, args: ["same", 42, 42], expect: "PASS same"}
    - {method: check, args: ["swap", 10, 3], expect: "FAIL swap: expected 10 but got 3"}
hints:
  h1: "There are two separate problems: check the condition, then check the order of the numbers in the message."
  h2: "The comparison should be == for PASS, and expected and actual are swapped in the FAIL message."
ai_assisted: true
