id: j1-l3.3-retrieve-tickets
type: write
title: "Cinema prices"
lesson: j1-l3.3
role: retrieval
assesses: [o1, o2]
concepts: [J1.06]
evidence: [IMPL]
misconceptions: []
difficulty: 2
variant_group: if-chains
prompt: |
  Complete `ticketPrice`: children under 12 pay 5, people aged 65 and over pay 6, and everyone else pays 10.
entry:
  methods:
    - {name: ticketPrice, params: [{name: age, type: "int"}], returns: "int"}
tests:
  visible:
    - {args: [8], expect: 5}
    - {args: [30], expect: 10}
    - {args: [70], expect: 6}
  hidden:
    - {name: "just under 12", args: [11], expect: 5}
    - {name: "exactly 12", args: [12], expect: 10}
    - {name: "just under 65", args: [64], expect: 10}
    - {name: "exactly 65", args: [65], expect: 6}
    - {name: "a baby", args: [0], expect: 5}
hints:
  h1: "Three cases. The last one, everyone else, goes in the else."
  h2: "if (age < 12) return 5; else if (age >= 65) return 6; else return 10;"
ai_assisted: true
