id: j1-l4.3-retrieve-odds
type: write
title: "Odd numbers"
lesson: j1-l4.3
role: retrieval
assesses: [o1, o3]
concepts: [J1.07]
evidence: [IMPL]
misconceptions: []
difficulty: 2
variant_group: for-sums
prompt: |
  Complete `sumOfOdds` so it returns the sum of every odd number from 1 up to and including `n`. For example, `sumOfOdds(7)` is 1 + 3 + 5 + 7 = 16.
entry:
  methods:
    - {name: sumOfOdds, params: [{name: n, type: "int"}], returns: "int"}
tests:
  visible:
    - {args: [7], expect: 16}
    - {args: [1], expect: 1}
    - {args: [10], expect: 25}
  hidden:
    - {name: "zero", args: [0], expect: 0}
    - {name: "two", args: [2], expect: 1}
    - {name: "ninety-nine", args: [99], expect: 2500}
    - {name: "a hundred", args: [100], expect: 2500}
    - {name: "five", args: [5], expect: 9}
hints:
  h1: "Start at 1 and step by 2: that only ever visits odd numbers."
  h2: "for (int i = 1; i <= n; i += 2) { total += i; }"
ai_assisted: true
