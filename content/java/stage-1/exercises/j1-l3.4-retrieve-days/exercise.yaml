id: j1-l3.4-retrieve-days
type: write
title: "Days in a month"
lesson: j1-l3.4
role: retrieval
assesses: [o1, o2]
concepts: [J1.06]
evidence: [IMPL]
misconceptions: []
difficulty: 2
variant_group: switch-mapping
prompt: |
  Complete `daysInMonth` with a switch expression. Ignore leap years: February has 28 days. April, June, September and November have 30; the other months have 31. Any number that isn't a month (1 to 12) gives 0.
entry:
  methods:
    - {name: daysInMonth, params: [{name: month, type: "int"}], returns: "int"}
tests:
  visible:
    - {args: [1], expect: 31}
    - {args: [4], expect: 30}
    - {args: [2], expect: 28}
  hidden:
    - {name: "December", args: [12], expect: 31}
    - {name: "November", args: [11], expect: 30}
    - {name: "August", args: [8], expect: 31}
    - {name: "not a month", args: [13], expect: 0}
    - {name: "zero", args: [0], expect: 0}
hints:
  h1: "Group the months by how many days they have, one case per group."
  h2: "case 1, 3, 5, 7, 8, 10, 12 -> 31; case 4, 6, 9, 11 -> 30; case 2 -> 28; default -> 0;"
ai_assisted: true
