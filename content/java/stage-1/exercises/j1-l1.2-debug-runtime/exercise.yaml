id: j1-l1.2-debug-runtime
type: debug
title: It compiles, then crashes
lesson: j1-l1.2
role: ladder
assesses: [o3]
concepts: [J1.13, J1.01]
evidence: [DEBUG]
misconceptions: []
difficulty: 1
prompt: |
  This program compiles, but crashes while it runs. It should share 12 sweets between **4**
  friends and print:
  
  ```
  Sharing 12 sweets between 4 friends...
  3
  ```
  
  Run it, read what happens, and fix it.
tests:
  visible:
    - {name: prints the right lines, stdin: "", stdout_equals: "Sharing 12 sweets between 4 friends...\n3"}
hints:
  h1: The first line prints, then the program stops. Which line does the error point to, and what does it say?
  h2: "Dividing by zero has no answer, so Java stops with ArithmeticException. There are 4 friends, not 0: change both places."
ai_assisted: true
