id: j1-l6.3-write-evens
type: write
title: "Keep the evens"
lesson: j1-l6.3
role: ladder
assesses: [o1, o2]
concepts: [J1.11]
evidence: [IMPL]
misconceptions: []
difficulty: 2
variant_group: list-filter
prompt: |
  Write a method called `evens` that is given an `ArrayList<Integer>` called `numbers` and returns a **new** `ArrayList<Integer>` containing only the even numbers, in the same order. The original list must not change.
entry:
  methods:
    - {name: evens, params: [{name: numbers, type: "ArrayList<Integer>"}], returns: "ArrayList<Integer>"}
tests:
  visible:
    - {args: [[1, 2, 3, 4, 5, 6]], expect: [2, 4, 6]}
    - {args: [[]], expect: []}
    - {args: [[7, 9]], expect: []}
  hidden:
    - {name: "one even", args: [[2]], expect: [2]}
    - {name: "zero and negatives", args: [[0, -2, -3]], expect: [0, -2]}
    - {name: "repeats", args: [[8, 8, 8]], expect: [8, 8, 8]}
    - {name: "all odd", args: [[1, 3, 5, 7, 9]], expect: []}
    - {name: "alternating", args: [[10, 11, 12, 13, 14]], expect: [10, 12, 14]}
starter_compiles: false
hints:
  h1: "Filter: make an empty result list and add each even number to it."
  h2: "if (number % 2 == 0) result.add(number);"
ai_assisted: true
