id: j1-l6.1-retrieve-largest
type: write
title: "The largest element"
lesson: j1-l6.1
role: retrieval
assesses: [o1, o2]
concepts: [J1.10]
evidence: [IMPL]
misconceptions: []
difficulty: 2
variant_group: array-patterns
prompt: |
  Write a method called `largest` that is given a non-empty `int[]` called `values` and returns its largest element. The elements may be negative.
entry:
  methods:
    - {name: largest, params: [{name: values, type: "int[]"}], returns: "int"}
tests:
  visible:
    - {args: [[4, 8, 15, 16]], expect: 16}
    - {args: [[-5, -2, -9]], expect: -2}
    - {args: [[7]], expect: 7}
  hidden:
    - {name: "descending", args: [[16, 15, 8, 4]], expect: 16}
    - {name: "all equal", args: [[0, 0, 0]], expect: 0}
    - {name: "zero is largest", args: [[-1, 0, -1]], expect: 0}
    - {name: "repeated max", args: [[100, 5, 100]], expect: 100}
    - {name: "two nines", args: [[3, 9, 2, 9, 1]], expect: 9}
starter_compiles: false
hints:
  h1: "Track the largest. What should the first 'best so far' be if every element could be negative?"
  h2: "Start with int best = values[0]; and replace it whenever a bigger value appears."
ai_assisted: true
