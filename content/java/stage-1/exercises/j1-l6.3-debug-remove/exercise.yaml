id: j1-l6.3-debug-remove
type: debug
title: "Remove the value"
lesson: j1-l6.3
role: ladder
assesses: [o4]
concepts: [J1.11]
evidence: [DEBUG]
misconceptions: []
difficulty: 2
prompt: |
  `removeValue` should remove the **first item equal to** `value` from a list of ints, and return the list. If the value isn't there, the list is returned unchanged. It crashes for some inputs. Find and fix the bug.
entry:
  methods:
    - {name: removeValue, params: [{name: numbers, type: "ArrayList<Integer>"}, {name: value, type: "int"}], returns: "ArrayList<Integer>"}
tests:
  visible:
    - {args: [[5, 10, 15], 10], expect: [5, 15]}
    - {args: [[1, 2, 3], 3], expect: [1, 2]}
    - {args: [[4, 5], 9], expect: [4, 5]}
  hidden:
    - {name: "empty list", args: [[], 1], expect: []}
    - {name: "removes only the first", args: [[7, 7, 7], 7], expect: [7, 7]}
    - {name: "first", args: [[100, 200], 100], expect: [200]}
    - {name: "index equals value", args: [[0, 1, 2], 2], expect: [0, 1]}
    - {name: "middle", args: [[10, 20, 30, 40, 50], 30], expect: [10, 20, 40, 50]}
hints:
  h1: "What does remove do when it's given a plain int?"
  h2: "A plain int means an index. Wrap the value: numbers.remove(Integer.valueOf(value))."
ai_assisted: true
