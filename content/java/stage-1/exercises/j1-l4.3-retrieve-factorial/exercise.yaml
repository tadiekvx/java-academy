id: j1-l4.3-retrieve-factorial
type: write
title: "Factorials"
lesson: j1-l4.3
role: retrieval
assesses: [o1, o3]
concepts: [J1.07]
evidence: [IMPL]
misconceptions: []
difficulty: 2
variant_group: for-sums
prompt: |
  The factorial of n is 1 × 2 × 3 × … × n. For example, the factorial of 4 is 24. The factorial of 0 is defined as 1. Complete `factorial` for any `n` from 0 to 12.
entry:
  methods:
    - {name: factorial, params: [{name: n, type: "int"}], returns: "int"}
tests:
  visible:
    - {args: [4], expect: 24}
    - {args: [1], expect: 1}
    - {args: [0], expect: 1}
  hidden:
    - {name: "five", args: [5], expect: 120}
    - {name: "ten", args: [10], expect: 3628800}
    - {name: "twelve", args: [12], expect: 479001600}
    - {name: "two", args: [2], expect: 2}
    - {name: "three", args: [3], expect: 6}
hints:
  h1: "You're multiplying, not adding. What should the running result start at?"
  h2: "int result = 1; for (int i = 2; i <= n; i++) { result *= i; }"
ai_assisted: true
