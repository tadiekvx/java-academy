id: j1-l4.5-retrieve-percentage
type: write
title: "Ask for a percentage"
lesson: j1-l4.5
role: retrieval
assesses: [o1, o2, o3]
concepts: [J1.05, J1.07]
evidence: [IMPL]
misconceptions: []
difficulty: 3
variant_group: validation-loop
prompt: |
  Write `main` so it keeps asking `Percentage: ` until the person types a whole number from 0 to 100. Each time the input is bad, print `Please enter a whole number from 0 to 100.` When it's good, print `Percentage accepted: N`. `isWholeNumber` is provided.
tests:
  visible:
    - {name: "valid first time", stdin: "50\n", stdout_contains: ["Percentage accepted: 50"]}
    - {name: "one bad then good", stdin: "abc\n100\n", stdout_contains: ["Percentage accepted: 100", "Please enter a whole number from 0 to 100."]}
    - {name: "range edge", stdin: "101\n0\n", stdout_contains: ["Percentage accepted: 0", "Please enter a whole number from 0 to 100."]}
  hidden:
    - {name: "empty line first", stdin: "\n0\n", stdout_contains: ["Percentage accepted: 0", "Please enter a whole number from 0 to 100."]}
    - {name: "negative then good", stdin: "-3\n0\n", stdout_contains: ["Percentage accepted: 0", "Please enter a whole number from 0 to 100."]}
    - {name: "decimal then good", stdin: "2.5\n100\n", stdout_contains: ["Percentage accepted: 100", "Please enter a whole number from 0 to 100."]}
    - {name: "several bad", stdin: "x\n150\n 7 7\n100\n", stdout_contains: ["Percentage accepted: 100", "Please enter a whole number from 0 to 100."]}
    - {name: "spaces around", stdin: "  0  \n", stdout_contains: ["Percentage accepted: 0"]}
    - {name: "huge number", stdin: "99999999999999999999\n100\n", stdout_contains: ["Percentage accepted: 100", "Please enter a whole number from 0 to 100."]}
hints:
  h1: "Loop until valid; check the digits before converting."
  h2: "Same shape as asking for an age, with a different range and messages."
ai_assisted: true
