id: j1-l3.3-debug-order
type: debug
title: "Everyone gets a C"
lesson: j1-l3.3
role: ladder
assesses: [o2]
concepts: [J1.06]
evidence: [DEBUG]
misconceptions: [MC11]
difficulty: 2
prompt: |
  `grade` should give 70+ an A, 60+ a B, 50+ a C, and anything lower a Fail. A student who scored 92 got a C. Find and fix the bug.
entry:
  methods:
    - {name: grade, params: [{name: score, type: "int"}], returns: "String"}
tests:
  visible:
    - {args: [75], expect: "A"}
    - {args: [62], expect: "B"}
    - {args: [30], expect: "Fail"}
  hidden:
    - {name: "exactly 70", args: [70], expect: "A"}
    - {name: "exactly 60", args: [60], expect: "B"}
    - {name: "exactly 50", args: [50], expect: "C"}
    - {name: "just failing", args: [49], expect: "Fail"}
    - {name: "full marks", args: [100], expect: "A"}
    - {name: "zero", args: [0], expect: "Fail"}
hints:
  h1: "Trace grade(92). Which condition is checked first, and is it true?"
  h2: "92 >= 50 is true, so the first branch wins. Reverse the order: check >= 70 first, then >= 60, then >= 50."
ai_assisted: true
