id: j1-l5.4-write-leap
type: write
title: "Leap years"
lesson: j1-l5.4
role: ladder
assesses: [o1, o2]
concepts: [J1.09]
evidence: [IMPL]
misconceptions: []
difficulty: 3
prompt: |
  Write `divisibleBy(number, d)` (returns whether `number` is divisible by `d`) and `isLeapYear(year)`, which uses it. A year is a leap year if it's divisible by 400, or if it's divisible by 4 but not by 100.
entry:
  methods:
    - {name: isLeapYear, params: [{name: year, type: "int"}], returns: "boolean"}
    - {name: divisibleBy, params: [{name: number, type: "int"}, {name: d, type: "int"}], returns: "boolean"}
tests:
  visible:
    - {args: [2024], expect: true}
    - {args: [1900], expect: false}
    - {args: [2000], expect: true}
    - {method: divisibleBy, args: [12, 4], expect: true}
  hidden:
    - {name: "ordinary", args: [2023], expect: false}
    - {name: "century", args: [2100], expect: false}
    - {name: "divisible by 400", args: [1600], expect: true}
    - {name: "four", args: [4], expect: true}
    - {name: "odd", args: [1999], expect: false}
    - {name: "not divisible", method: divisibleBy, args: [7, 2], expect: false}
starter_compiles: false
hints:
  h1: "Write the helper first. Then check 400 first, then 100, then 4."
  h2: "if divisibleBy 400 → true; else if divisibleBy 100 → false; else divisibleBy 4."
ai_assisted: true
