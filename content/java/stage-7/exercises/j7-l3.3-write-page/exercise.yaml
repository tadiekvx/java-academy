id: j7-l3.3-write-page
type: write
title: "Pages of results"
lesson: j7-l3.3
role: ladder
assesses: [o1]
concepts: [J7.10]
evidence: [IMPL]
misconceptions: [MC175]
difficulty: 3
prompt: |
  A list endpoint returns one page at a time. Pages are numbered from 0. Write `pageOf(items, page, size)`: the items on that page, in order, or an empty list for a negative page, a size below 1, or a page past the end. Also write `totalPages(total, size)`: how many pages `total` items need, 0 for a size below 1 or a negative total.
entry:
  methods:
    - {name: pageOf, params: [{name: items, type: "List<Integer>"}, {name: page, type: "int"}, {name: size, type: "int"}], returns: "List<Integer>"}
    - {name: totalPages, params: [{name: total, type: "int"}, {name: size, type: "int"}], returns: "int"}
tests:
  visible:
    - {name: "first page", method: pageOf, args: [[1, 2, 3, 4, 5, 6, 7], 0, 3], expect: [1, 2, 3]}
    - {name: "a short last page", method: pageOf, args: [[1, 2, 3, 4, 5, 6, 7], 2, 3], expect: [7]}
    - {name: "pages for 7 items", method: totalPages, args: [7, 3], expect: 3}
  hidden:
    - {name: "an exact last page", method: pageOf, args: [[1, 2, 3, 4, 5, 6], 1, 3], expect: [4, 5, 6]}
    - {name: "past the end", method: pageOf, args: [[1, 2, 3], 5, 3], expect: []}
    - {name: "negative page", method: pageOf, args: [[1, 2, 3], -1, 3], expect: []}
    - {name: "size zero", method: pageOf, args: [[1, 2, 3], 0, 0], expect: []}
    - {name: "no items", method: pageOf, args: [[], 0, 10], expect: []}
    - {name: "a huge size", method: pageOf, args: [[1, 2, 3], 1, 2147483647], expect: []}
    - {name: "a huge page number", method: pageOf, args: [[1, 2, 3], 2147483647, 2], expect: []}
    - {name: "an exact fit", method: totalPages, args: [6, 3], expect: 2}
    - {name: "no items", method: totalPages, args: [0, 5], expect: 0}
    - {name: "size zero", method: totalPages, args: [5, 0], expect: 0}
    - {name: "one item", method: totalPages, args: [1, 100], expect: 1}
hints:
  h1: "Page 0 starts at item 0. Where does page `p` start?"
  h2: "What happens to `page * size` for a very large page?"
ai_assisted: true
