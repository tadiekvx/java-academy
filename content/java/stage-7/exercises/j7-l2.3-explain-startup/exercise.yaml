id: j7-l2.3-explain-startup
type: explain
title: "Reading what the framework did"
lesson: j7-l2.3
role: ladder
assesses: [o1, o2]
concepts: [J7.07]
evidence: [EXPL]
misconceptions: []
difficulty: 2
prompt: |
  This is an excerpt of the real startup log of this platform's own backend (a Spring Boot application). Say what it tells you the framework did for you without being asked, how you would find out *why* a particular bean exists, and how you would replace one of the beans it created.

  ```text
  2026-11-07T13:16:13.868+02:00  INFO 78249 --- [academy] [           main] academy.AcademyApplication               : No active profile set, falling back to 1 default profile: "default"
  2026-11-07T13:16:14.243+02:00  INFO 78249 --- [academy] [           main] o.s.boot.tomcat.TomcatWebServer          : Tomcat initialized with port 8092 (http)
  2026-11-07T13:16:14.248+02:00  INFO 78249 --- [academy] [           main] o.apache.catalina.core.StandardEngine    : Starting Servlet engine: [Apache Tomcat/11.0.27]
  2026-11-07T13:16:14.421+02:00  INFO 78249 --- [academy] [           main] com.zaxxer.hikari.HikariDataSource       : HikariPool-1 - Start completed.
  2026-11-07T13:16:14.438+02:00  INFO 78249 --- [academy] [           main] org.flywaydb.core.FlywayExecutor         : Database: jdbc:postgresql://localhost:5433/academy (PostgreSQL 18.6)
  2026-11-07T13:16:15.161+02:00  INFO 78249 --- [academy] [           main] o.s.boot.tomcat.TomcatWebServer          : Tomcat started on port 8092 (http) with context path '/'
  2026-11-07T13:16:15.163+02:00  INFO 78249 --- [academy] [           main] academy.AcademyApplication               : Started AcademyApplication in 1.431 seconds (process running for 1.555)
  ```
rubric:
  criteria: |
    The log shows the application context starting, the embedded web server being started on a port, and the active profile. Auto-configuration added these because the libraries are on the classpath. To see which auto-configuration applied and why, start with --debug and read the conditions report. To replace a bean, define your own bean of that type; auto-configuration is non-invasive and backs away.
  levels:
    - score: 2
      descriptor: "The answer reads the log, names the --debug conditions report, and says defining your own bean replaces the default."
      samples:
        - "It started the Spring context and an embedded web server on a port, which it did because the web libraries are on the classpath. Running with --debug prints a conditions report of what matched and why. To replace a bean I define my own of that type and the default backs away."
        - "The framework configured the server and the application without me writing that code: the dependencies on the classpath triggered it. The --debug switch logs a conditions report explaining each decision. Auto-configuration is non-invasive, so my own DataSource bean, for example, replaces the default one."
    - score: 1
      descriptor: "The answer reads the log but does not say how to investigate or customise."
      samples:
        - "It started a web server and the application."
        - "The log shows the framework starting up with some configuration."
    - score: 0
      descriptor: "The answer treats startup as fixed and unchangeable."
      samples:
        - "It is Spring's own code, so you cannot change what it does."
        - "The log is just noise and cannot tell you anything."
ai_assisted: true
