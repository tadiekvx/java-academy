id: j7-p1-brightbank-api
title: "Brightbank's REST API"
category: B
status: in_review
summary: "Build the request handling of a small accounts API in plain Java: routing, status codes, validation and state."
brief: |
  Brightbank needs an HTTP API for its accounts. In this course the platform cannot run Spring, so you write the part Spring's controllers would do: look at each request (`METHOD path body`), decide what it means, change the data and return `status|body`.

  1. **Routing and reads**: tell a missing resource (404) from a wrong method (405).
  2. **Create and delete**: validate input, answer 201 and 204 honestly, and never reuse an id.
  3. **Replace and deposit**: the idempotent PUT and the non-idempotent POST.

  Requests in one call are handled in order, against the same data, which starts with two accounts.
estimated_hours: 4
prerequisites: [j7-l1.4, j7-l3.1, j7-l3.2, j7-l3.3]
concepts: [J7.02, J7.03, J7.04, J7.08, J7.09]
requirements:
  - "Every response status is the one RFC 9110 and the task describe."
  - "Unknown paths, bad ids and wrong methods get different responses."
  - "A rejected request changes no data."
constraints:
  - "Plain Java only: no framework is available."
  - "Handle requests in the order given."
acceptance:
  - "Given a missing account, then 404; given a wrong method on an existing path, then 405."
  - "Given a bad body, then 400 and no id is used."
  - "Given a repeated PUT, then the account is unchanged by the repeat."
milestones:
  - id: m1
    title: "Routing and reads"
    instructions: |
      Make `handleAll` answer these, one response per request, in order:

      - `GET /accounts` → `200|1,2` (the ids, comma separated, ascending).
      - `GET /accounts/{id}` → `200|id;owner;cents`, or `404|Not Found` when there is no such account.
      - A path that is not an accounts path, or has a non-numeric id, or has extra segments that do not exist → `404|Not Found`.
      - A path that exists but with a method it does not support → `405|Method Not Allowed`.

      The paths that exist are `/accounts`, `/accounts/{id}` and `/accounts/{id}/deposit`. Use the routing you wrote in lesson 7.1.4.
    entry:
      methods:
        - {name: handleAll, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
    tests:
      visible:
        - {name: "reads", method: handleAll, args: [["GET /accounts", "GET /accounts/1", "GET /accounts/2"]], expect: ["200|1,2", "200|1;Ada Lovelace;120000", "200|2;Grace Hopper;30050"]}
        - {name: "missing", method: handleAll, args: [["GET /accounts/9", "GET /accounts/abc", "GET /customers", "GET /accounts/"]], expect: ["404|Not Found", "404|Not Found", "404|Not Found", "404|Not Found"]}
        - {name: "wrong method", method: handleAll, args: [["DELETE /accounts", "PUT /accounts", "POST /accounts/1", "PATCH /accounts/1", "POST /accounts/1/deposit x"]], expect: ["405|Method Not Allowed", "405|Method Not Allowed", "405|Method Not Allowed", "405|Method Not Allowed", "400|Bad Request"]}
      hidden:
        - {name: "reads", method: handleAll, args: [["GET /accounts", "GET /accounts/1", "GET /accounts/2"]], expect: ["200|1,2", "200|1;Ada Lovelace;120000", "200|2;Grace Hopper;30050"]}
        - {name: "missing", method: handleAll, args: [["GET /accounts/9", "GET /accounts/abc", "GET /customers", "GET /accounts/"]], expect: ["404|Not Found", "404|Not Found", "404|Not Found", "404|Not Found"]}
        - {name: "wrong method", method: handleAll, args: [["DELETE /accounts", "PUT /accounts", "POST /accounts/1", "PATCH /accounts/1", "POST /accounts/1/deposit x"]], expect: ["405|Method Not Allowed", "405|Method Not Allowed", "405|Method Not Allowed", "405|Method Not Allowed", "400|Bad Request"]}
        - {name: "sub-resource path", method: handleAll, args: [["GET /accounts/1/deposit", "GET /accounts/1/other", "GET /accounts/1/deposit/"]], expect: ["405|Method Not Allowed", "404|Not Found", "404|Not Found"]}
        - {name: "empty and odd paths", method: handleAll, args: [["GET ", "GET /", "GET /accounts/007"]], expect: ["404|Not Found", "404|Not Found", "404|Not Found"]}
        - {name: "many reads", method: handleAll, args: [["GET /accounts", "GET /accounts/1", "GET /accounts/9", "DELETE /accounts"]], expect: ["200|1,2", "200|1;Ada Lovelace;120000", "404|Not Found", "405|Method Not Allowed"]}
  - id: m2
    title: "Create and delete"
    instructions: |
      - `POST /accounts owner;cents` creates an account with the next free id (3, then 4, ...) and answers `201|/accounts/ID`.
      - A body that is not `owner;cents`, a blank owner, or cents that are not 1 to 9 digits → `400|Bad Request`, and no id is used up.
      - `DELETE /accounts/{id}` → `204|` (nothing after the bar), or `404|Not Found`.
      - Ids are never reused.
    entry:
      methods:
        - {name: handleAll, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
    tests:
      visible:
        - {name: "create one", method: handleAll, args: [["POST /accounts Alan Turing;500", "GET /accounts", "GET /accounts/3"]], expect: ["201|/accounts/3", "200|1,2,3", "200|3;Alan Turing;500"]}
        - {name: "bad bodies", method: handleAll, args: [["POST /accounts ;5", "POST /accounts Alan;abc", "POST /accounts Alan", "POST /accounts Alan;1;2", "POST /accounts"]], expect: ["400|Bad Request", "400|Bad Request", "400|Bad Request", "400|Bad Request", "400|Bad Request"]}
        - {name: "delete", method: handleAll, args: [["DELETE /accounts/1", "GET /accounts", "DELETE /accounts/1", "GET /accounts/1"]], expect: ["204|", "200|2", "404|Not Found", "404|Not Found"]}
      hidden:
        - {name: "create one", method: handleAll, args: [["POST /accounts Alan Turing;500", "GET /accounts", "GET /accounts/3"]], expect: ["201|/accounts/3", "200|1,2,3", "200|3;Alan Turing;500"]}
        - {name: "bad bodies", method: handleAll, args: [["POST /accounts ;5", "POST /accounts Alan;abc", "POST /accounts Alan", "POST /accounts Alan;1;2", "POST /accounts"]], expect: ["400|Bad Request", "400|Bad Request", "400|Bad Request", "400|Bad Request", "400|Bad Request"]}
        - {name: "delete", method: handleAll, args: [["DELETE /accounts/1", "GET /accounts", "DELETE /accounts/1", "GET /accounts/1"]], expect: ["204|", "200|2", "404|Not Found", "404|Not Found"]}
        - {name: "ids are not reused", method: handleAll, args: [["POST /accounts A;1", "DELETE /accounts/3", "POST /accounts B;2", "GET /accounts"]], expect: ["201|/accounts/3", "204|", "201|/accounts/4", "200|1,2,4"]}
        - {name: "a failed create takes no id", method: handleAll, args: [["POST /accounts ;1", "POST /accounts C;3", "GET /accounts"]], expect: ["400|Bad Request", "201|/accounts/3", "200|1,2,3"]}
        - {name: "zero balance", method: handleAll, args: [["POST /accounts Zed;0", "GET /accounts/3"]], expect: ["201|/accounts/3", "200|3;Zed;0"]}
        - {name: "too big a number", method: handleAll, args: [["POST /accounts Big;1234567890", "GET /accounts"]], expect: ["400|Bad Request", "200|1,2"]}
        - {name: "delete twice", method: handleAll, args: [["DELETE /accounts/2", "DELETE /accounts/2"]], expect: ["204|", "404|Not Found"]}
  - id: m3
    title: "Replace and deposit"
    instructions: |
      - `PUT /accounts/{id} owner;cents` replaces the account (`200|id;owner;cents`) or creates it with that id (`201|id;owner;cents`). The next id for a `POST` must stay above every id in use.
      - `POST /accounts/{id}/deposit cents` adds the cents (1 to 9 digits, above zero) and answers `200|newBalance`. An unknown account is `404|Not Found`, a bad amount `400|Bad Request`.
      - Any other method on `/accounts/{id}/deposit` is `405|Method Not Allowed`.
    entry:
      methods:
        - {name: handleAll, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
    tests:
      visible:
        - {name: "replace and create", method: handleAll, args: [["PUT /accounts/1 Ada L;7", "PUT /accounts/10 New Person;9", "GET /accounts"]], expect: ["200|1;Ada L;7", "201|10;New Person;9", "200|1,2,10"]}
        - {name: "deposit", method: handleAll, args: [["POST /accounts/1/deposit 500", "POST /accounts/1/deposit 25", "GET /accounts/1"]], expect: ["200|120500", "200|120525", "200|1;Ada Lovelace;120525"]}
        - {name: "deposit errors", method: handleAll, args: [["POST /accounts/9/deposit 5", "POST /accounts/1/deposit 0", "POST /accounts/1/deposit abc", "POST /accounts/1/deposit -5"]], expect: ["404|Not Found", "400|Bad Request", "400|Bad Request", "400|Bad Request"]}
      hidden:
        - {name: "replace and create", method: handleAll, args: [["PUT /accounts/1 Ada L;7", "PUT /accounts/10 New Person;9", "GET /accounts"]], expect: ["200|1;Ada L;7", "201|10;New Person;9", "200|1,2,10"]}
        - {name: "deposit", method: handleAll, args: [["POST /accounts/1/deposit 500", "POST /accounts/1/deposit 25", "GET /accounts/1"]], expect: ["200|120500", "200|120525", "200|1;Ada Lovelace;120525"]}
        - {name: "deposit errors", method: handleAll, args: [["POST /accounts/9/deposit 5", "POST /accounts/1/deposit 0", "POST /accounts/1/deposit abc", "POST /accounts/1/deposit -5"]], expect: ["404|Not Found", "400|Bad Request", "400|Bad Request", "400|Bad Request"]}
        - {name: "bad replace", method: handleAll, args: [["PUT /accounts/1 ;5", "PUT /accounts/1 X;y", "PUT /accounts/1"]], expect: ["400|Bad Request", "400|Bad Request", "400|Bad Request"]}
        - {name: "the next id follows a replace", method: handleAll, args: [["PUT /accounts/5 Five;5", "POST /accounts Six;6", "GET /accounts"]], expect: ["201|5;Five;5", "201|/accounts/6", "200|1,2,5,6"]}
        - {name: "deposit on a deleted account", method: handleAll, args: [["DELETE /accounts/2", "POST /accounts/2/deposit 5"]], expect: ["204|", "404|Not Found"]}
        - {name: "deposit method", method: handleAll, args: [["GET /accounts/1/deposit", "PUT /accounts/1/deposit 5"]], expect: ["405|Method Not Allowed", "405|Method Not Allowed"]}
        - {name: "replace keeps leading digits out", method: handleAll, args: [["PUT /accounts/2 Grace;00042", "GET /accounts/2"]], expect: ["200|2;Grace;42", "200|2;Grace;42"]}
rubric:
  - criterion: "Correct HTTP semantics"
    zero: "Status codes are wrong or inconsistent"
    one: "Mostly right, with confusion between 400, 404 and 405"
    two: "Every status follows RFC 9110 and the task, including 201, 204 and 405"
  - criterion: "Routing"
    zero: "Paths are matched with string checks that break on odd input"
    one: "Works for normal paths"
    two: "A clear routing structure that treats unknown paths, bad ids and wrong methods differently"
  - criterion: "Validation and state"
    zero: "Bad input changes state, or ids are reused"
    one: "Bad input is rejected, but one state rule is missed"
    two: "Failed requests change nothing, and ids stay unique"
  - criterion: "Design note"
    zero: "Missing or only describes the code"
    one: "Explains the code but not the choices"
    two: "Explains how each response maps to the lessons' rules and what the real Spring annotations would be"
design_note_prompt: |
  In 150 words or fewer: Which of your responses did you have to decide between 400, 404 and 405, and how did you choose? Write the Spring annotations you would use for the `PUT /accounts/{id}` and `POST /accounts/{id}/deposit` handlers, and say which of the two a client may safely retry and why.
ai_assisted: true
