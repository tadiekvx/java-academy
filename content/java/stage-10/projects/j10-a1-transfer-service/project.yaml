id: j10-a1-transfer-service
title: "The transfer that happened twice"
category: C
status: in_review
summary: "Take over a transfer endpoint that double-charges retries and loses money when the second step fails; make it idempotent and compensating, and record the decision."
brief: |
  You have inherited a transfer endpoint. A request is `key from to cents`, optionally followed by the word `crash`, which means that in this attempt the second service (the one that credits the receiver) is down.

  Two tickets have come in:

  1. **Ticket 1001**: customers are charged twice when their phone retries.
  2. **Ticket 1002**: when the credit fails, the money is gone.

  Fix them one at a time, running all the checks after each. Then write an ADR (see lesson 10.1.3) for the design you chose. In a real system the debit and the credit would be in two databases; say in the ADR what that would change.
estimated_hours: 4
prerequisites: [j10-l1.3, j10-l2.2, j10-l2.3]
concepts: [J10.05, J10.06, J10.03]
requirements:
  - "The same key and body always return the same response and move money once."
  - "A failed credit leaves every balance as it was, and the client can retry."
  - "The total of all balances never changes."
constraints:
  - "Fix one ticket at a time."
  - "Run all the checks after every change."
acceptance:
  - "Given a retried request, then the second response equals the first."
  - "Given a key reused with another body, then 409."
  - "Given a crash, then the balances are unchanged and a retry succeeds."
milestones:
  - id: m1
    title: "Ticket 1001: charged twice"
    instructions: |
      **Ticket 1001:** *"Customers are charged twice when their phone retries a transfer."*

      Make `key` an idempotency key (lesson 10.2.2): the first request with a key is processed and its response stored; the same key with the same `from to cents` returns **exactly the stored response** and changes nothing; the same key with a different body is `409|Conflict`. A request that is malformed (`400|Bad Request`) or invalid is not stored, so its key can be used again. An unaffordable transfer is stored (`422|Insufficient funds`), so its retry gives the same answer.
    entry:
      methods:
        - {name: handleAll, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
    tests:
      visible:
        - {name: "a retried request", method: handleAll, args: [["k1 a b 100", "k1 a b 100"]], expect: ["200|a=900;b=1100;c=1000", "200|a=900;b=1100;c=1000"]}
        - {name: "the key reused with another body", method: handleAll, args: [["k1 a b 100", "k1 a c 100"]], expect: ["200|a=900;b=1100;c=1000", "409|Conflict"]}
        - {name: "a different key", method: handleAll, args: [["k1 a b 100", "k2 a b 100"]], expect: ["200|a=900;b=1100;c=1000", "200|a=800;b=1200;c=1000"]}
      hidden:
        - {name: "a retried request", method: handleAll, args: [["k1 a b 100", "k1 a b 100"]], expect: ["200|a=900;b=1100;c=1000", "200|a=900;b=1100;c=1000"]}
        - {name: "the key reused with another body", method: handleAll, args: [["k1 a b 100", "k1 a c 100"]], expect: ["200|a=900;b=1100;c=1000", "409|Conflict"]}
        - {name: "a different key", method: handleAll, args: [["k1 a b 100", "k2 a b 100"]], expect: ["200|a=900;b=1100;c=1000", "200|a=800;b=1200;c=1000"]}
        - {name: "a rejected request is remembered", method: handleAll, args: [["k1 a b 5000", "k1 a b 5000", "k2 a b 5"]], expect: ["422|Insufficient funds", "422|Insufficient funds", "200|a=995;b=1005;c=1000"]}
        - {name: "a rejected request is remembered even when funds arrive later", method: handleAll, args: [["k1 a b 1500", "k2 b a 600", "k1 a b 1500"]], expect: ["422|Insufficient funds", "200|a=1600;b=400;c=1000", "422|Insufficient funds"]}
        - {name: "an invalid request does not use up the key", method: handleAll, args: [["k1 a a 10", "k1 a b 10"]], expect: ["400|Bad Request", "200|a=990;b=1010;c=1000"]}
        - {name: "a malformed request", method: handleAll, args: [["k1 a b", "k1 a b x", "k1 a b 1 crashx"]], expect: ["400|Bad Request", "400|Bad Request", "400|Bad Request"]}
        - {name: "a retry after later transfers still answers the first result", method: handleAll, args: [["k1 a b 100", "k2 b c 50", "k1 a b 100"]], expect: ["200|a=900;b=1100;c=1000", "200|a=900;b=1050;c=1050", "200|a=900;b=1100;c=1000"]}
        - {name: "two retries", method: handleAll, args: [["k1 a b 100", "k1 a b 100", "k1 a b 100"]], expect: ["200|a=900;b=1100;c=1000", "200|a=900;b=1100;c=1000", "200|a=900;b=1100;c=1000"]}
        - {name: "unknown account and zero amount", method: handleAll, args: [["k1 a z 10", "k2 a b 0"]], expect: ["400|Bad Request", "400|Bad Request"]}
        - {name: "different amounts under one key", method: handleAll, args: [["k1 a b 100", "k1 a b 101", "k1 a b 100"]], expect: ["200|a=900;b=1100;c=1000", "409|Conflict", "200|a=900;b=1100;c=1000"]}
  - id: m2
    title: "Ticket 1002: money that vanished"
    instructions: |
      **Ticket 1002:** *"When the credit fails the money has gone from the sender and arrived nowhere."*

      A request ending in `crash` models the second service failing after the debit. Compensate (lesson 10.2.3): reverse the debit, answer `502|Credit failed, debit reversed`, and do **not** store the key, so that the client's retry of the same request can succeed. Balances must always add up to 3000.
    entry:
      methods:
        - {name: handleAll, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
    tests:
      visible:
        - {name: "a crash is compensated", method: handleAll, args: [["k1 a b 100 crash"]], expect: ["502|Credit failed, debit reversed"]}
        - {name: "a retry after the crash works", method: handleAll, args: [["k1 a b 100 crash", "k1 a b 100"]], expect: ["502|Credit failed, debit reversed", "200|a=900;b=1100;c=1000"]}
        - {name: "money is never lost", method: handleAll, args: [["k1 a b 100 crash", "k2 b c 10", "k3 c a 5 crash"]], expect: ["502|Credit failed, debit reversed", "200|a=1000;b=990;c=1010", "502|Credit failed, debit reversed"]}
      hidden:
        - {name: "a crash is compensated", method: handleAll, args: [["k1 a b 100 crash"]], expect: ["502|Credit failed, debit reversed"]}
        - {name: "a retry after the crash works", method: handleAll, args: [["k1 a b 100 crash", "k1 a b 100"]], expect: ["502|Credit failed, debit reversed", "200|a=900;b=1100;c=1000"]}
        - {name: "money is never lost", method: handleAll, args: [["k1 a b 100 crash", "k2 b c 10", "k3 c a 5 crash"]], expect: ["502|Credit failed, debit reversed", "200|a=1000;b=990;c=1010", "502|Credit failed, debit reversed"]}
        - {name: "a retried request", method: handleAll, args: [["k1 a b 100", "k1 a b 100"]], expect: ["200|a=900;b=1100;c=1000", "200|a=900;b=1100;c=1000"]}
        - {name: "the key reused with another body", method: handleAll, args: [["k1 a b 100", "k1 a c 100"]], expect: ["200|a=900;b=1100;c=1000", "409|Conflict"]}
        - {name: "a different key", method: handleAll, args: [["k1 a b 100", "k2 a b 100"]], expect: ["200|a=900;b=1100;c=1000", "200|a=800;b=1200;c=1000"]}
        - {name: "a rejected request is remembered", method: handleAll, args: [["k1 a b 5000", "k1 a b 5000", "k2 a b 5"]], expect: ["422|Insufficient funds", "422|Insufficient funds", "200|a=995;b=1005;c=1000"]}
        - {name: "a rejected request is remembered even when funds arrive later", method: handleAll, args: [["k1 a b 1500", "k2 b a 600", "k1 a b 1500"]], expect: ["422|Insufficient funds", "200|a=1600;b=400;c=1000", "422|Insufficient funds"]}
        - {name: "an invalid request does not use up the key", method: handleAll, args: [["k1 a a 10", "k1 a b 10"]], expect: ["400|Bad Request", "200|a=990;b=1010;c=1000"]}
        - {name: "a malformed request", method: handleAll, args: [["k1 a b", "k1 a b x", "k1 a b 1 crashx"]], expect: ["400|Bad Request", "400|Bad Request", "400|Bad Request"]}
        - {name: "a retry after later transfers still answers the first result", method: handleAll, args: [["k1 a b 100", "k2 b c 50", "k1 a b 100"]], expect: ["200|a=900;b=1100;c=1000", "200|a=900;b=1050;c=1050", "200|a=900;b=1100;c=1000"]}
        - {name: "two retries", method: handleAll, args: [["k1 a b 100", "k1 a b 100", "k1 a b 100"]], expect: ["200|a=900;b=1100;c=1000", "200|a=900;b=1100;c=1000", "200|a=900;b=1100;c=1000"]}
        - {name: "unknown account and zero amount", method: handleAll, args: [["k1 a z 10", "k2 a b 0"]], expect: ["400|Bad Request", "400|Bad Request"]}
        - {name: "different amounts under one key", method: handleAll, args: [["k1 a b 100", "k1 a b 101", "k1 a b 100"]], expect: ["200|a=900;b=1100;c=1000", "409|Conflict", "200|a=900;b=1100;c=1000"]}
        - {name: "a crash on an unaffordable transfer is reported as insufficient", method: handleAll, args: [["k1 a b 5000 crash"]], expect: ["422|Insufficient funds"]}
        - {name: "a crash does not use up the key", method: handleAll, args: [["k1 a b 100 crash", "k1 a b 100", "k1 a b 100"]], expect: ["502|Credit failed, debit reversed", "200|a=900;b=1100;c=1000", "200|a=900;b=1100;c=1000"]}
        - {name: "several crashes", method: handleAll, args: [["k1 a b 10 crash", "k2 a b 10 crash", "k3 a b 10"]], expect: ["502|Credit failed, debit reversed", "502|Credit failed, debit reversed", "200|a=990;b=1010;c=1000"]}
        - {name: "the retry with a crash after a success is a duplicate", method: handleAll, args: [["k1 a b 100", "k1 a b 100 crash"]], expect: ["200|a=900;b=1100;c=1000", "200|a=900;b=1100;c=1000"]}
rubric:
  - criterion: "Idempotency"
    zero: "A retry still moves money twice, or the stored response is rebuilt differently"
    one: "Duplicates are caught but the mismatch or rejected cases are wrong"
    two: "Every duplicate returns the exact stored response, a reused key with another body is a conflict, and invalid requests leave the key free"
  - criterion: "Failure handling"
    zero: "The debit is lost on a crash, or the crash blocks the retry"
    one: "The debit is reversed but the key is stored"
    two: "The debit is compensated, the key is not stored, and the retry succeeds"
  - criterion: "Reasoning about order"
    zero: "No argument about where a crash could still leave the system wrong"
    one: "Notes one crash point"
    two: "Identifies the crash points (after debit, after credit, before storing the key) and says what the design does or does not cover"
  - criterion: "Decision record"
    zero: "Missing, or only describes the code"
    one: "States what was done without alternatives"
    two: "A short ADR with context, decision (idempotency key plus compensation), and consequences including what a real two-database version would need (outbox, durable key store)"
design_note_prompt: |
  Write an ADR (200 words or fewer) with Title, Status, Context, Decision and Consequences for the design you chose. Say why the key comes from the client, why a crashed attempt does not store its key, what could still go wrong if the process dies between the debit and the compensation, and what an outbox and a durable key store would add in a version with two databases.
ai_assisted: true
