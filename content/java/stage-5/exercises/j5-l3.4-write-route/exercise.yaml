id: j5-l3.4-write-route
type: write
title: "Which way?"
lesson: j5-l3.4
role: ladder
assesses: [o2]
concepts: [J5.12]
evidence: [IMPL]
misconceptions: []
difficulty: 5
prompt: |
  Write `route(n, edges, from, to)`: the cheapest path itself, as node numbers joined by `>` from `from` to `to`, such as `0>2>1>3`; `none` if the target can't be reached. (The checks only use graphs where the cheapest route is unique.) Extend Dijkstra with a `previous` array: whenever you improve a node's cost, remember which node you came from; then follow it back from the target and reverse.
entry:
  methods:
    - {name: route, params: [{name: n, type: "int"}, {name: edges, type: "String[]"}, {name: from, type: "int"}, {name: to, type: "int"}], returns: "String"}
tests:
  visible:
    - {method: route, args: [4, ["0-1:4", "0-2:1", "2-1:2", "1-3:1", "2-3:5"], 0, 3], expect: "0>2>1>3"}
    - {method: route, args: [3, ["0-1:5"], 0, 2], expect: "none"}
    - {method: route, args: [2, [], 1, 1], expect: "1"}
    - {name: "uses a PriorityQueue", source_contains: ["PriorityQueue"]}
  hidden:
    - {method: route, args: [6, ["0-1:7", "0-2:9", "0-5:14", "1-2:10", "1-3:15", "2-3:11", "2-5:2", "3-4:6", "4-5:9"], 0, 4], expect: "0>2>5>4"}
    - {method: route, args: [5, ["0-1:1", "1-2:1", "2-3:1", "0-3:10", "3-4:2"], 0, 4], expect: "0>1>2>3>4"}
    - {method: route, args: [4, ["0-1:1", "2-3:1"], 0, 3], expect: "none"}
    - {method: route, args: [6, ["0-1:7", "0-2:9", "0-5:14", "1-2:10", "1-3:15", "2-3:11", "2-5:2", "3-4:6", "4-5:9"], 4, 0], expect: "4>5>2>0"}
    - {method: route, args: [4, ["0-1:4", "0-2:1", "2-1:2", "1-3:1", "2-3:5"], 3, 0], expect: "3>1>2>0"}
hints:
  h1: "When you improve cost[next], also set previous[next] = node. At the end walk from the target back to the start, collecting nodes, and reverse the list."
  h2: "previous[next] = node; ... for (int at = to; at != -1; at = previous[at]) path.add(at); Collections.reverse(path);"
ai_assisted: true
