id: j5-l3.2-write-first
type: write
title: "A logarithmic search for the first match"
lesson: j5-l3.2
role: ladder
assesses: [o1]
concepts: [J5.10]
evidence: [IMPL]
misconceptions: []
difficulty: 4
prompt: |
  `CountingArray` wraps a sorted `int[]` and counts how many times `get` is called. Write `firstIndex(CountingArray array, int target)`: the index of the **first** occurrence of `target`, or `-1`. The values repeat (the array is `0,0,0,1,1,1,2,2,2,...`). The driver also checks `fast=true`: that you read only about `2 * log2(n)` elements, so a linear scan fails even if its answer is right.
entry:
  methods:
    - {name: run, params: [{name: n, type: "int"}, {name: target, type: "int"}], returns: "String"}
tests:
  visible:
    - {method: run, args: [10, 1], expect: "3 fast=true"}
    - {method: run, args: [10, 5], expect: "-1 fast=true"}
    - {method: run, args: [1, 0], expect: "0 fast=true"}
    - {name: "doesn't scan every element", source_not_contains: ["for (int i = 0; i < array.size()"]}
  hidden:
    - {method: run, args: [1000000, 0], expect: "0 fast=true"}
    - {method: run, args: [1000000, 333332], expect: "999996 fast=true"}
    - {method: run, args: [1000000, 333333], expect: "999999 fast=true"}
    - {method: run, args: [1000000, 17], expect: "51 fast=true"}
    - {method: run, args: [999999, 333332], expect: "999996 fast=true"}
    - {method: run, args: [3, 0], expect: "0 fast=true"}
    - {method: run, args: [3, 1], expect: "-1 fast=true"}
    - {method: run, args: [2000000, 600000], expect: "1800000 fast=true"}
hints:
  h1: "Keep a low and high index and look at the middle. On a match, remember it but keep searching the left half (high = mid - 1)."
  h2: "if (value == target) { found = mid; high = mid - 1; }"
ai_assisted: true
