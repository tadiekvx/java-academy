id: j5-l2.6-write-heap
type: write
title: "A min-heap on an array"
lesson: j5-l2.6
role: ladder
assesses: [o1]
concepts: [J5.08]
evidence: [IMPL]
misconceptions: []
difficulty: 5
prompt: |
  Write `MinHeap`: a min-heap of `int`s **stored in an `int[]`** (no `PriorityQueue`, `TreeSet` or sorting). `add(int)` puts the value at the end and sifts it up; `poll()` removes and returns the smallest, moving the last value to the root and sifting it down (it throws `NoSuchElementException` if empty); `peek()` returns the smallest without removing it (same exception if empty); `size()`. The array should grow when full. The driver prints each polled value (or `E`), then the final size and, if any remain, the smallest.
entry:
  methods:
    - {name: run, params: [{name: ops, type: "String[]"}], returns: "String"}
tests:
  visible:
    - {method: run, args: [["add:5", "add:1", "add:3", "poll", "poll"]], expect: "1 3 size=1 peek=5"}
    - {method: run, args: [["poll"]], expect: "E size=0"}
    - {method: run, args: [[]], expect: "size=0"}
    - {name: "stored in an int array, no library queue", source_contains: ["int[]"], source_not_contains: ["new PriorityQueue", "new TreeSet", "sort("]}
  hidden:
    - {method: run, args: [["add:2", "add:2", "add:2", "poll", "poll", "poll", "poll"]], expect: "2 2 2 E size=0"}
    - {method: run, args: [["add:9", "add:8", "add:7", "add:6", "add:5", "add:4", "add:3", "add:2", "add:1", "poll", "poll", "poll"]], expect: "1 2 3 size=6 peek=4"}
    - {method: run, args: [["add:-5", "add:0", "add:-10", "poll", "add:-7", "poll", "poll"]], expect: "-10 -7 -5 size=1 peek=0"}
    - {method: run, args: [["add:1", "add:2", "add:3", "add:4", "add:5", "add:6", "poll", "add:0", "poll", "poll"]], expect: "1 0 2 size=4 peek=3"}
    - {method: run, args: [["add:42"]], expect: "size=1 peek=42"}
    - {method: run, args: [["add:3", "add:1", "add:2", "poll", "add:0", "poll", "poll", "poll", "poll"]], expect: "1 0 2 3 E size=0"}
hints:
  h1: "Parent of i is (i-1)/2; children are 2i+1 and 2i+2. add: put at the end, swap up while smaller than the parent. poll: move the last to the root, swap down with the smaller child."
  h2: "while (i > 0 && data[i] < data[(i - 1) / 2]) { swap(i, (i - 1) / 2); i = (i - 1) / 2; }"
