        - {name: "a key reused with another body", method: handleAll, args: [["ada POST /transfers k1 1 2 100", "ada POST /transfers k1 1 3 100"]], expect: ["200|1:900;2:1100;3:1000", "409|Conflict"]}
        - {name: "a rejected transfer is remembered", method: handleAll, args: [["ada POST /transfers k1 1 2 5000", "ada POST /transfers k1 1 2 5000"]], expect: ["422|Insufficient funds", "422|Insufficient funds"]}
        - {name: "an invalid request leaves the key free", method: handleAll, args: [["ada POST /transfers k1 1 1 10", "ada POST /transfers k1 1 2 10"]], expect: ["400|Bad Request", "200|1:990;2:1010;3:1000"]}
        - {name: "forbidden does not use up the key", method: handleAll, args: [["ada POST /transfers k1 2 1 10", "grace POST /transfers k1 2 1 10"]], expect: ["403|Forbidden", "200|1:1010;2:990;3:1000"]}
        - {name: "several retries and crashes", method: handleAll, args: [["ada POST /transfers a 1 2 10 crash", "ada POST /transfers a 1 2 10", "ada POST /transfers a 1 2 10", "ada POST /transfers b 1 3 10 crash"]], expect: ["502|Credit failed, debit reversed", "200|1:990;2:1010;3:1000", "200|1:990;2:1010;3:1000", "502|Credit failed, debit reversed"]}
        - {name: "no requests", method: auditLines, args: [[]], expect: []}
        - {name: "a path with a backslash", method: auditLines, args: [["ada GET /a\\b"]], expect: ["{\"actor\":\"ada\",\"method\":\"GET\",\"path\":\"/a\\\\b\",\"status\":404}"]}
        - {name: "bodies are not logged", method: auditLines, args: [["ada POST /transfers secret-key 1 2 5"]], expect: ["{\"actor\":\"ada\",\"method\":\"POST\",\"path\":\"/transfers\",\"status\":200}"]}
        - {name: "every status is a number", method: auditLines, args: [["ada DELETE /accounts/1", "mallory GET /accounts/1", "tess POST /transfers k 1 2 10 crash"]], expect: ["{\"actor\":\"ada\",\"method\":\"DELETE\",\"path\":\"/accounts/1\",\"status\":405}", "{\"actor\":\"mallory\",\"method\":\"GET\",\"path\":\"/accounts/1\",\"status\":401}", "{\"actor\":\"tess\",\"method\":\"POST\",\"path\":\"/transfers\",\"status\":502}"]}
        - {name: "health with odd methods", method: handleAll, args: [["- DELETE /health", "tess GET /health"]], expect: ["405|Method Not Allowed", "200|ok"]}
  - id: m4
    title: "Change 4: the incident"
    instructions: |
      At 03:12 the on-call phone rings: `POST /transfers` with an amount of `99999999999` made the service answer `500` and fill the logs with stack traces; at 03:20 someone found that it is the same for any amount with more than nine digits. The cause is in the input check. Fix it so that any amount that is not 1 to 9 digits is a `400|Bad Request`, keep every earlier behaviour, and then answer the questions in the design note. Do not hide the failure behind a catch-all.
    entry:
      methods:
        - {name: handleAll, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
        - {name: auditLines, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
    tests:
      visible:
        - {name: "an enormous amount", method: handleAll, args: [["ada POST /transfers k1 1 2 99999999999"]], expect: ["400|Bad Request"]}
        - {name: "a negative amount", method: handleAll, args: [["ada POST /transfers k1 1 2 -5"]], expect: ["400|Bad Request"]}
        - {name: "the largest accepted amount", method: handleAll, args: [["tess POST /transfers k1 1 2 999999999"]], expect: ["422|Insufficient funds"]}
