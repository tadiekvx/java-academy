        - {name: "a path with a backslash", method: auditLines, args: [["ada GET /a\\b"]], expect: ["{\"actor\":\"ada\",\"method\":\"GET\",\"path\":\"/a\\\\b\",\"status\":404}"]}
        - {name: "bodies are not logged", method: auditLines, args: [["ada POST /transfers secret-key 1 2 5"]], expect: ["{\"actor\":\"ada\",\"method\":\"POST\",\"path\":\"/transfers\",\"status\":200}"]}
        - {name: "every status is a number", method: auditLines, args: [["ada DELETE /accounts/1", "mallory GET /accounts/1", "tess POST /transfers k 1 2 10 crash"]], expect: ["{\"actor\":\"ada\",\"method\":\"DELETE\",\"path\":\"/accounts/1\",\"status\":405}", "{\"actor\":\"mallory\",\"method\":\"GET\",\"path\":\"/accounts/1\",\"status\":401}", "{\"actor\":\"tess\",\"method\":\"POST\",\"path\":\"/transfers\",\"status\":502}"]}
        - {name: "health with odd methods", method: handleAll, args: [["- DELETE /health", "tess GET /health"]], expect: ["405|Method Not Allowed", "200|ok"]}
        - {name: "an amount that overflows an int", method: handleAll, args: [["ada POST /transfers k1 1 2 2147483648"]], expect: ["400|Bad Request"]}
        - {name: "ten digits", method: handleAll, args: [["ada POST /transfers k1 1 2 1000000000"]], expect: ["400|Bad Request"]}
        - {name: "garbage after valid requests", method: handleAll, args: [["ada GET /accounts/1", "ada POST /transfers k1 1 2 99999999999999999999", "ada GET /accounts/1"]], expect: ["200|1;ada;1000", "400|Bad Request", "200|1;ada;1000"]}
        - {name: "the oversized request is logged as a 400", method: auditLines, args: [["ada POST /transfers k1 1 2 99999999999"]], expect: ["{\"actor\":\"ada\",\"method\":\"POST\",\"path\":\"/transfers\",\"status\":400}"]}
rubric:
  - criterion: "Correctness and tests"
    zero: "Changes break earlier behaviour, or only the visible checks pass"
    one: "All checks pass but the changes were made in one step"
    two: "Each change made separately with all checks run after it; the code handles the cases the hidden checks probe"
  - criterion: "Security and reliability"
    zero: "Ownership, idempotency or compensation is missing or inconsistent"
    one: "Each present but a gap remains (a stored key on a crash, a body in a log)"
    two: "Ownership is checked before funds, keys are stored only for definite outcomes, a crash is compensated, and nothing sensitive is logged"
  - criterion: "Operability"
    zero: "Health and audit lines are missing or leak data"
    one: "They work but are not structured or escaped"
    two: "A health endpoint with no login, structured audit lines with escaping, and the incident fixed at its cause"
  - criterion: "Written justification"
    zero: "Missing, or repeats the code"
    one: "Describes what was done without alternatives or evidence"
    two: "ADRs for the two significant decisions, a blameless post-incident review with timeline, cause, fix and follow-ups, and honest limits of the model"
design_note_prompt: |
  Write (400 words or fewer, three parts). (1) Two short ADRs (Title, Status, Context, Decision, Consequences): one for how you made transfers safe to retry, one for your choice of what the audit line contains and omits. (2) A blameless post-incident review of change 4: timeline (03:12, 03:20, your fix), cause, why the checks of the earlier changes did not catch it, what you fixed, and two follow-up actions with an owner each (for example an alert, a test). (3) Three things this model does not cover that a real deployment of this API would need (name at least one from each of Stage 8, Stage 10 and Stage 11).
ai_assisted: true
