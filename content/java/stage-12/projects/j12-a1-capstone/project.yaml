id: j12-a1-capstone
title: "Capstone: take over, change, operate"
category: C
status: in_review
summary: "Take over an acquired company's API and carry it through four changes: a new requirement, reliability, observability and a production incident; then justify your decisions in writing."
brief: |
  This is the last project. There is no tutorial for it. You inherit a small account API from a company Brightbank has acquired. It reads accounts and nothing more. Over four changes you will make it do what the business needs and then deal with the consequences:

  1. A **new requirement**: transfers between accounts.
  2. **Reliability**: retries must not repeat a transfer; a failed credit must not lose money.
  3. **Observability**: a health endpoint and structured audit lines that leak nothing.
  4. An **incident**: an input that crashes the service.

  Change one thing at a time and run all the checks after each. Your written note is part of the assessment: two decision records and a post-incident review. The platform cannot run a real service, a database or a pipeline, so the project models the API logic; say in your note what a real deployment would add.
estimated_hours: 8
prerequisites: [j7-l3.2, j8-l2.3, j10-l2.2, j10-l2.3, j12-l1.1, j12-l1.4]
concepts: [J7.09, J8.07, J10.05, J10.06, J12.01, J12.04]
requirements:
  - "Transfers follow the rules of the first change, then the reliability rules, then the observability rules."
  - "An oversized amount is a 400, never a 500."
  - "Nothing sensitive is written to an audit line."
constraints:
  - "Change one thing at a time."
  - "Run all the checks after every change."
  - "Do not catch everything and hide it."
acceptance:
  - "Given another customer's account, then 403."
  - "Given a retried transfer, then the same response and one effect."
  - "Given a crash, then the balances are unchanged and a retry works."
  - "Given an amount with ten digits, then 400."
milestones:
  - id: m1
    title: "Change 1: a new requirement"
    instructions: |
      The partner's API can only read accounts. Product now wants **transfers**: `actor POST /transfers key from to cents`. Rules, in this order: a malformed body (four words, or five with the last one `crash`, and `cents` 1 to 9 digits) is `400|Bad Request`; unknown or identical accounts or an amount of zero is `400|Bad Request`; the actor must own the `from` account, or be the teller `tess`, otherwise `403|Forbidden`; not enough money is `422|Insufficient funds`; otherwise move the money and answer `200|` followed by all balances as `id:balance` separated by `;` in id order. Other methods on `/transfers` are `405|Method Not Allowed`. (Ignore `crash` and repeated keys for now; later changes handle them.)
    entry:
      methods:
        - {name: handleAll, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
        - {name: auditLines, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
    tests:
      visible:
        - {name: "own money, enough funds", method: handleAll, args: [["ada POST /transfers k1 1 2 100"]], expect: ["200|1:900;2:1100;3:1000"]}
        - {name: "someone else's money", method: handleAll, args: [["ada POST /transfers k1 2 1 100"]], expect: ["403|Forbidden"]}
        - {name: "not enough money", method: handleAll, args: [["ada POST /transfers k1 1 2 5000"]], expect: ["422|Insufficient funds"]}
      hidden:
        - {name: "own money, enough funds", method: handleAll, args: [["ada POST /transfers k1 1 2 100"]], expect: ["200|1:900;2:1100;3:1000"]}
        - {name: "someone else's money", method: handleAll, args: [["ada POST /transfers k1 2 1 100"]], expect: ["403|Forbidden"]}
        - {name: "not enough money", method: handleAll, args: [["ada POST /transfers k1 1 2 5000"]], expect: ["422|Insufficient funds"]}
        - {name: "a teller may move any money", method: handleAll, args: [["tess POST /transfers k1 2 3 50"]], expect: ["200|1:1000;2:950;3:1050"]}
        - {name: "unknown account", method: handleAll, args: [["ada POST /transfers k1 1 9 10"]], expect: ["400|Bad Request"]}
        - {name: "same account", method: handleAll, args: [["ada POST /transfers k1 1 1 10"]], expect: ["400|Bad Request"]}
        - {name: "zero amount", method: handleAll, args: [["ada POST /transfers k1 1 2 0"]], expect: ["400|Bad Request"]}
        - {name: "malformed body", method: handleAll, args: [["ada POST /transfers k1 1 2", "ada POST /transfers k1 1 2 x"]], expect: ["400|Bad Request", "400|Bad Request"]}
        - {name: "balances accumulate", method: handleAll, args: [["ada POST /transfers a 1 2 100", "grace POST /transfers b 2 3 300", "ada GET /accounts/2"]], expect: ["200|1:900;2:1100;3:1000", "200|1:900;2:800;3:1300", "403|Forbidden"]}
        - {name: "nobody signed in", method: handleAll, args: [["- POST /transfers k1 1 2 10"]], expect: ["401|Unauthorized"]}
        - {name: "wrong method", method: handleAll, args: [["ada GET /transfers"]], expect: ["405|Method Not Allowed"]}
        - {name: "reads as before", method: handleAll, args: [["ada GET /accounts/1", "ada GET /accounts/2", "ada GET /accounts/9", "tess GET /accounts/2"]], expect: ["200|1;ada;1000", "403|Forbidden", "404|Not Found", "200|2;grace;1000"]}
  - id: m2
    title: "Change 2: make it reliable"
    instructions: |
      Apply lessons 10.2.2 and 10.2.3. The `key` is an idempotency key: the first request with a key is processed and its response stored; the same key with the same body returns the stored response; the same key with a different body is `409|Conflict`. Invalid, forbidden and malformed requests are not stored. A transfer ending in `crash` (the credit step fails) must leave the balances unchanged, answer `502|Credit failed, debit reversed`, and must **not** store the key.
    entry:
      methods:
        - {name: handleAll, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
        - {name: auditLines, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
    tests:
      visible:
        - {name: "a retried transfer", method: handleAll, args: [["ada POST /transfers k1 1 2 100", "ada POST /transfers k1 1 2 100"]], expect: ["200|1:900;2:1100;3:1000", "200|1:900;2:1100;3:1000"]}
        - {name: "a crash is compensated", method: handleAll, args: [["ada POST /transfers k1 1 2 100 crash", "ada GET /accounts/1"]], expect: ["502|Credit failed, debit reversed", "200|1;ada;1000"]}
        - {name: "retry after a crash", method: handleAll, args: [["ada POST /transfers k1 1 2 100 crash", "ada POST /transfers k1 1 2 100"]], expect: ["502|Credit failed, debit reversed", "200|1:900;2:1100;3:1000"]}
      hidden:
        - {name: "a retried transfer", method: handleAll, args: [["ada POST /transfers k1 1 2 100", "ada POST /transfers k1 1 2 100"]], expect: ["200|1:900;2:1100;3:1000", "200|1:900;2:1100;3:1000"]}
        - {name: "a crash is compensated", method: handleAll, args: [["ada POST /transfers k1 1 2 100 crash", "ada GET /accounts/1"]], expect: ["502|Credit failed, debit reversed", "200|1;ada;1000"]}
        - {name: "retry after a crash", method: handleAll, args: [["ada POST /transfers k1 1 2 100 crash", "ada POST /transfers k1 1 2 100"]], expect: ["502|Credit failed, debit reversed", "200|1:900;2:1100;3:1000"]}
        - {name: "own money, enough funds", method: handleAll, args: [["ada POST /transfers k1 1 2 100"]], expect: ["200|1:900;2:1100;3:1000"]}
        - {name: "someone else's money", method: handleAll, args: [["ada POST /transfers k1 2 1 100"]], expect: ["403|Forbidden"]}
        - {name: "not enough money", method: handleAll, args: [["ada POST /transfers k1 1 2 5000"]], expect: ["422|Insufficient funds"]}
        - {name: "a teller may move any money", method: handleAll, args: [["tess POST /transfers k1 2 3 50"]], expect: ["200|1:1000;2:950;3:1050"]}
        - {name: "unknown account", method: handleAll, args: [["ada POST /transfers k1 1 9 10"]], expect: ["400|Bad Request"]}
        - {name: "same account", method: handleAll, args: [["ada POST /transfers k1 1 1 10"]], expect: ["400|Bad Request"]}
        - {name: "zero amount", method: handleAll, args: [["ada POST /transfers k1 1 2 0"]], expect: ["400|Bad Request"]}
        - {name: "malformed body", method: handleAll, args: [["ada POST /transfers k1 1 2", "ada POST /transfers k1 1 2 x"]], expect: ["400|Bad Request", "400|Bad Request"]}
        - {name: "balances accumulate", method: handleAll, args: [["ada POST /transfers a 1 2 100", "grace POST /transfers b 2 3 300", "ada GET /accounts/2"]], expect: ["200|1:900;2:1100;3:1000", "200|1:900;2:800;3:1300", "403|Forbidden"]}
        - {name: "nobody signed in", method: handleAll, args: [["- POST /transfers k1 1 2 10"]], expect: ["401|Unauthorized"]}
        - {name: "wrong method", method: handleAll, args: [["ada GET /transfers"]], expect: ["405|Method Not Allowed"]}
        - {name: "reads as before", method: handleAll, args: [["ada GET /accounts/1", "ada GET /accounts/2", "ada GET /accounts/9", "tess GET /accounts/2"]], expect: ["200|1;ada;1000", "403|Forbidden", "404|Not Found", "200|2;grace;1000"]}
        - {name: "a key reused with another body", method: handleAll, args: [["ada POST /transfers k1 1 2 100", "ada POST /transfers k1 1 3 100"]], expect: ["200|1:900;2:1100;3:1000", "409|Conflict"]}
        - {name: "a rejected transfer is remembered", method: handleAll, args: [["ada POST /transfers k1 1 2 5000", "ada POST /transfers k1 1 2 5000"]], expect: ["422|Insufficient funds", "422|Insufficient funds"]}
        - {name: "an invalid request leaves the key free", method: handleAll, args: [["ada POST /transfers k1 1 1 10", "ada POST /transfers k1 1 2 10"]], expect: ["400|Bad Request", "200|1:990;2:1010;3:1000"]}
        - {name: "forbidden does not use up the key", method: handleAll, args: [["ada POST /transfers k1 2 1 10", "grace POST /transfers k1 2 1 10"]], expect: ["403|Forbidden", "200|1:1010;2:990;3:1000"]}
        - {name: "several retries and crashes", method: handleAll, args: [["ada POST /transfers a 1 2 10 crash", "ada POST /transfers a 1 2 10", "ada POST /transfers a 1 2 10", "ada POST /transfers b 1 3 10 crash"]], expect: ["502|Credit failed, debit reversed", "200|1:990;2:1010;3:1000", "200|1:990;2:1010;3:1000", "502|Credit failed, debit reversed"]}
  - id: m3
    title: "Change 3: make it observable"
    instructions: |
      Apply lessons 12.1.1 and 8.1.4. First, `GET /health` answers `200|ok` for **anybody**, signed in or not; other methods on it are `405|Method Not Allowed`. Second, `auditLines(requests)` returns one structured JSON line per request, after handling them in order: `{"actor":"ada","method":"GET","path":"/accounts/1","status":200}` with no spaces, exactly those four members in that order, the status as a number, and `"` and `\` escaped inside the strings. Missing parts of a short request are empty strings. **Never log the body**: transfer keys and amounts do not belong in an audit line.
    entry:
      methods:
        - {name: handleAll, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
        - {name: auditLines, params: [{name: requests, type: "List<String>"}], returns: "List<String>"}
    tests:
      visible:
        - {name: "audit lines for a few requests", method: auditLines, args: [["ada GET /accounts/1", "- GET /accounts/1", "ada POST /transfers k1 1 2 100", "ada GET /acc\"ounts", "", "grace GET /health"]], expect: ["{\"actor\":\"ada\",\"method\":\"GET\",\"path\":\"/accounts/1\",\"status\":200}", "{\"actor\":\"-\",\"method\":\"GET\",\"path\":\"/accounts/1\",\"status\":401}", "{\"actor\":\"ada\",\"method\":\"POST\",\"path\":\"/transfers\",\"status\":200}", "{\"actor\":\"ada\",\"method\":\"GET\",\"path\":\"/acc\\\"ounts\",\"status\":404}", "{\"actor\":\"\",\"method\":\"\",\"path\":\"\",\"status\":400}", "{\"actor\":\"grace\",\"method\":\"GET\",\"path\":\"/health\",\"status\":200}"]}
        - {name: "health needs no login", method: handleAll, args: [["- GET /health"]], expect: ["200|ok"]}
        - {name: "health is read-only", method: handleAll, args: [["ada POST /health"]], expect: ["405|Method Not Allowed"]}
      hidden:
        - {name: "audit lines for a few requests", method: auditLines, args: [["ada GET /accounts/1", "- GET /accounts/1", "ada POST /transfers k1 1 2 100", "ada GET /acc\"ounts", "", "grace GET /health"]], expect: ["{\"actor\":\"ada\",\"method\":\"GET\",\"path\":\"/accounts/1\",\"status\":200}", "{\"actor\":\"-\",\"method\":\"GET\",\"path\":\"/accounts/1\",\"status\":401}", "{\"actor\":\"ada\",\"method\":\"POST\",\"path\":\"/transfers\",\"status\":200}", "{\"actor\":\"ada\",\"method\":\"GET\",\"path\":\"/acc\\\"ounts\",\"status\":404}", "{\"actor\":\"\",\"method\":\"\",\"path\":\"\",\"status\":400}", "{\"actor\":\"grace\",\"method\":\"GET\",\"path\":\"/health\",\"status\":200}"]}
        - {name: "health needs no login", method: handleAll, args: [["- GET /health"]], expect: ["200|ok"]}
        - {name: "health is read-only", method: handleAll, args: [["ada POST /health"]], expect: ["405|Method Not Allowed"]}
        - {name: "a retried transfer", method: handleAll, args: [["ada POST /transfers k1 1 2 100", "ada POST /transfers k1 1 2 100"]], expect: ["200|1:900;2:1100;3:1000", "200|1:900;2:1100;3:1000"]}
        - {name: "a crash is compensated", method: handleAll, args: [["ada POST /transfers k1 1 2 100 crash", "ada GET /accounts/1"]], expect: ["502|Credit failed, debit reversed", "200|1;ada;1000"]}
        - {name: "retry after a crash", method: handleAll, args: [["ada POST /transfers k1 1 2 100 crash", "ada POST /transfers k1 1 2 100"]], expect: ["502|Credit failed, debit reversed", "200|1:900;2:1100;3:1000"]}
        - {name: "own money, enough funds", method: handleAll, args: [["ada POST /transfers k1 1 2 100"]], expect: ["200|1:900;2:1100;3:1000"]}
        - {name: "someone else's money", method: handleAll, args: [["ada POST /transfers k1 2 1 100"]], expect: ["403|Forbidden"]}
        - {name: "not enough money", method: handleAll, args: [["ada POST /transfers k1 1 2 5000"]], expect: ["422|Insufficient funds"]}
        - {name: "a teller may move any money", method: handleAll, args: [["tess POST /transfers k1 2 3 50"]], expect: ["200|1:1000;2:950;3:1050"]}
        - {name: "unknown account", method: handleAll, args: [["ada POST /transfers k1 1 9 10"]], expect: ["400|Bad Request"]}
        - {name: "same account", method: handleAll, args: [["ada POST /transfers k1 1 1 10"]], expect: ["400|Bad Request"]}
        - {name: "zero amount", method: handleAll, args: [["ada POST /transfers k1 1 2 0"]], expect: ["400|Bad Request"]}
        - {name: "malformed body", method: handleAll, args: [["ada POST /transfers k1 1 2", "ada POST /transfers k1 1 2 x"]], expect: ["400|Bad Request", "400|Bad Request"]}
        - {name: "balances accumulate", method: handleAll, args: [["ada POST /transfers a 1 2 100", "grace POST /transfers b 2 3 300", "ada GET /accounts/2"]], expect: ["200|1:900;2:1100;3:1000", "200|1:900;2:800;3:1300", "403|Forbidden"]}
