id: j12-l1.4-write-breach
type: write
title: "When did it start"
lesson: j12-l1.4
role: ladder
assesses: [o1]
concepts: [J12.04]
evidence: [IMPL, DEBUG]
misconceptions: [MC217]
difficulty: 3
prompt: |
  An alert should fire when a metric is **above** a threshold for several samples in a row, not on one blip. Samples are one per minute. Write `firstBreach(series, threshold, minutes)`: the index (from 0) of the first sample of the first run of at least `minutes` consecutive samples **strictly above** the threshold, or -1 if there is none.
entry:
  methods:
    - {name: firstBreach, params: [{name: series, type: "List<Integer>"}, {name: threshold, type: "int"}, {name: minutes, type: "int"}], returns: "int"}
tests:
  visible:
    - {name: "connections in use", method: firstBreach, args: [[3, 3, 4, 6, 9, 10, 10, 10], 8, 3], expect: 4}
    - {name: "p95 latency", method: firstBreach, args: [[120, 118, 125, 300, 900, 4800, 6200, 7000], 1000, 2], expect: 5}
    - {name: "never above", method: firstBreach, args: [[1, 2, 3], 10, 1], expect: -1}
  hidden:
    - {name: "an earlier blip does not count", method: firstBreach, args: [[9, 1, 9, 9, 9], 5, 3], expect: 2}
    - {name: "equal is not above", method: firstBreach, args: [[5, 5, 5], 5, 1], expect: -1}
    - {name: "too short", method: firstBreach, args: [[6, 6], 5, 3], expect: -1}
    - {name: "no samples", method: firstBreach, args: [[], 5, 1], expect: -1}
    - {name: "the run is broken then restarts", method: firstBreach, args: [[9, 9, 1, 9, 9, 9], 5, 3], expect: 3}
    - {name: "a single sample", method: firstBreach, args: [[9], 5, 1], expect: 0}
    - {name: "a longer run starts at its first sample", method: firstBreach, args: [[1, 9, 9, 9, 9], 5, 2], expect: 1}
hints:
  h1: "Count the current run, and reset it when a sample is not above the threshold."
  h2: "Report where the run started, not where it was detected."
ai_assisted: true
