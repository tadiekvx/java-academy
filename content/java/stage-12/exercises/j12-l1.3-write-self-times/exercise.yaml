id: j12-l1.3-write-self-times
type: write
title: "Where did the time go"
lesson: j12-l1.3
role: ladder
assesses: [o1]
concepts: [J12.03]
evidence: [IMPL]
misconceptions: [MC216]
difficulty: 3
prompt: |
  A trace is a tree of **spans**. Each is `id:parent:start:end` in milliseconds (the root's parent is `-`). A span's **self time** is its duration minus the total duration of its direct children (the time spent in the span itself, not waiting for children; children never overlap in these traces). Write `selfTimes(spans)` returning `id=self` for each span, in the order given.
entry:
  methods:
    - {name: selfTimes, params: [{name: spans, type: "List<String>"}], returns: "List<String>"}
tests:
  visible:
    - {name: "a transfer request", method: selfTimes, args: [["root:-:0:1000", "auth:root:10:60", "transfer:root:60:960", "debit:transfer:70:130", "credit:transfer:140:900", "notify:transfer:905:950"]], expect: ["root=50", "auth=50", "transfer=35", "debit=60", "credit=760", "notify=45"]}
    - {name: "a single span", method: selfTimes, args: [["only:-:5:15"]], expect: ["only=10"]}
    - {name: "one child", method: selfTimes, args: [["a:-:0:100", "b:a:10:60"]], expect: ["a=50", "b=50"]}
  hidden:
    - {name: "children fill the parent", method: selfTimes, args: [["a:-:0:100", "b:a:0:30", "c:a:30:100"]], expect: ["a=0", "b=30", "c=70"]}
    - {name: "a zero-length child", method: selfTimes, args: [["r:-:0:10", "x:r:0:0"]], expect: ["r=10", "x=0"]}
    - {name: "no spans", method: selfTimes, args: [[]], expect: []}
    - {name: "three levels", method: selfTimes, args: [["a:-:0:100", "b:a:10:50", "c:b:20:40"]], expect: ["a=60", "b=20", "c=20"]}
    - {name: "a child listed before its parent", method: selfTimes, args: [["leaf:p:5:9", "p:-:0:20"]], expect: ["leaf=4", "p=16"]}
    - {name: "four children", method: selfTimes, args: [["r:-:0:100", "a:r:0:10", "b:r:10:20", "c:r:20:30", "d:r:30:40"]], expect: ["r=60", "a=10", "b=10", "c=10", "d=10"]}
hints:
  h1: "Add up the durations of the spans that name each span as their parent."
  h2: "A span may appear before its parent in the list."
ai_assisted: true
