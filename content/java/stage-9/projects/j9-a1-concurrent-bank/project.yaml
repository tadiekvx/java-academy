rubric:
  - criterion: "Diagnosis"
    zero: "Changed code without finding the cause"
    one: "Found the cause of one problem by reasoning only"
    two: "Explained both causes from evidence: the lost increments of an unprotected counter and the cycle of lock waits, citing the shape of the dump"
  - criterion: "Right tool"
    zero: "Used volatile for the counter, or a global lock for the deadlock"
    one: "A correct fix that is heavier than needed"
    two: "An atomic for the counter and a global lock order for the deadlock, keeping per-account locks"
  - criterion: "Evidence of correctness"
    zero: "No reasoning about why the fix is complete"
    one: "Argued for the cases tested"
    two: "Argued why the lock order prevents any cycle for any set of accounts, not only the ones in the checks"
  - criterion: "Honesty about testing"
    zero: "Claims the code is proven thread-safe because the checks pass"
    one: "Notes the checks are probabilistic"
    two: "States that passing checks do not prove absence of a race and says what was done to make the code safe by construction"
design_note_prompt: |
  In 200 words or fewer: What caused each ticket, and what in the code or in a thread dump would show it? Why did you choose an atomic for the counter and a lock order for the deadlock, and why is `volatile` or a single global lock the wrong answer in each case? Argue why your lock order cannot form a cycle for any set of accounts. Say honestly what the checks can and cannot prove.
ai_assisted: true
