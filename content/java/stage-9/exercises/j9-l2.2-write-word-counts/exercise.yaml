id: j9-l2.2-write-word-counts
type: write
title: "Counting words from several threads"
lesson: j9-l2.2
role: ladder
assesses: [o1]
concepts: [J9.07]
evidence: [IMPL]
misconceptions: [MC193]
difficulty: 3
prompt: |
  Write `wordCounts(words, threads)`: worker threads share one `ConcurrentHashMap<String, Integer>`; worker `w` handles the words at positions `w`, `w + threads`, `w + 2*threads`, and so on, and counts each word with the **atomic** `merge` method. After joining the workers, return `word=count` pairs sorted by word and joined with commas (an empty string if there are no words).
entry:
  methods:
    - {name: wordCounts, params: [{name: words, type: "List<String>"}, {name: threads, type: "int"}], returns: "String"}
tests:
  visible:
    - {name: "three words", method: wordCounts, args: [["b", "a", "b"], 2], expect: "a=1,b=2"}
    - {name: "none", method: wordCounts, args: [[], 3], expect: ""}
    - {name: "more threads than words", method: wordCounts, args: [["x"], 4], expect: "x=1"}
    - {name: "uses ConcurrentHashMap", source_contains: ["ConcurrentHashMap"]}
    - {name: "updates atomically with merge", source_contains: ["merge"]}
