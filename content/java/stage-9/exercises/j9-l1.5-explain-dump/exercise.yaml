prompt: |
  This program deadlocks every time (a latch makes sure both threads hold their first lock before asking for the second). Its source and the deadlock section of a real thread dump, taken with `jcmd <pid> Thread.print` while it was stuck, follow.

  ```java
  import java.util.concurrent.CountDownLatch;

  public class Deadlock {
      static final Object ACCOUNT_A = new Object();
      static final Object ACCOUNT_B = new Object();

      public static void main(String[] args) throws Exception {
          CountDownLatch bothHoldOne = new CountDownLatch(2);
          Thread t1 = new Thread(() -> transfer(ACCOUNT_A, ACCOUNT_B, bothHoldOne), "transfer-A-to-B");
          Thread t2 = new Thread(() -> transfer(ACCOUNT_B, ACCOUNT_A, bothHoldOne), "transfer-B-to-A");
          t1.start();
          t2.start();
          t1.join();
          t2.join();
      }

      static void transfer(Object from, Object to, CountDownLatch latch) {
          synchronized (from) {
              latch.countDown();
              try {
                  latch.await();
              } catch (InterruptedException e) {
                  return;
              }
              synchronized (to) {
                  System.out.println("moved");
              }
          }
      }
  }
  ```

  ```text
  $ jcmd <pid> Thread.print   (excerpt)
  Found one Java-level deadlock:
  =============================
  "transfer-A-to-B":
    waiting to lock monitor 0x0000007c06cc6680 (object 0x0000007010617dd8, a java.lang.Object),
    which is held by "transfer-B-to-A"

  "transfer-B-to-A":
    waiting to lock monitor 0x0000007c06cc65a0 (object 0x0000007010617dc8, a java.lang.Object),
    which is held by "transfer-A-to-B"

  Java stack information for the threads listed above:
  ===================================================
  "transfer-A-to-B":
  	at Deadlock.transfer(Deadlock.java:26)
  	- waiting to lock <0x0000007010617dd8> (a java.lang.Object)
  	- locked <0x0000007010617dc8> (a java.lang.Object)
  	at Deadlock.lambda$main$0(Deadlock.java:9)
  	at Deadlock$$Lambda/0x00000f0001040210.run(Unknown Source)
  	at java.lang.Thread.runWith(java.base@25.0.5.0.3/Thread.java:1487)
  	at java.lang.Thread.run(java.base@25.0.5.0.3/Thread.java:1474)
  "transfer-B-to-A":
  	at Deadlock.transfer(Deadlock.java:26)
  	- waiting to lock <0x0000007010617dc8> (a java.lang.Object)
  	- locked <0x0000007010617dd8> (a java.lang.Object)
  	at Deadlock.lambda$main$1(Deadlock.java:10)
  	at Deadlock$$Lambda/0x00000f0001040440.run(Unknown Source)
  	at java.lang.Thread.runWith(java.base@25.0.5.0.3/Thread.java:1487)
  	at java.lang.Thread.run(java.base@25.0.5.0.3/Thread.java:1474)

  Found 1 deadlock.
