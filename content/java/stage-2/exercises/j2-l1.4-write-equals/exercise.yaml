id: j2-l1.4-write-equals
type: write
title: "Equal points"
lesson: j2-l1.4
role: ladder
assesses: [o3]
concepts: [J2.04]
evidence: [IMPL]
misconceptions: []
difficulty: 3
prompt: |
  Write `equals` and `hashCode` for `Point` so that two points with the same `x` and `y` are equal, and equal points have the same hash code. `compare` reports whether the points are equal, and then whether the hash-code rule holds (equal objects must give equal hash codes), as `true,true` for example.
entry:
  methods:
    - {name: compare, params: [{name: x1, type: "int"}, {name: y1, type: "int"}, {name: x2, type: "int"}, {name: y2, type: "int"}], returns: "String"}
tests:
  visible:
    - {method: compare, args: [1, 2, 1, 2], expect: "true,true"}
    - {method: compare, args: [1, 2, 3, 4], expect: "false,true"}
    - {method: compare, args: [0, 0, 0, 0], expect: "true,true"}
  hidden:
    - {method: compare, args: [1, 2, 2, 1], expect: "false,true"}
    - {method: compare, args: [5, 5, 5, 6], expect: "false,true"}
    - {method: compare, args: [-1, -1, -1, -1], expect: "true,true"}
    - {method: compare, args: [7, 8, 8, 8], expect: "false,true"}
    - {method: compare, args: [100, 200, 100, 200], expect: "true,true"}
hints:
  h1: "equals takes an Object. Check it's a Point, then compare both fields. hashCode should use the same fields."
  h2: "return x == p.x && y == p.y;  and  return Objects.hash(x, y);"
ai_assisted: true
