id: j6-l2.3-write-optimistic
type: write
title: "Optimistic withdrawal"
lesson: j6-l2.3
role: ladder
assesses: [o2]
concepts: [J6.07]
evidence: [IMPL]
misconceptions: []
difficulty: 3
prompt: |
  Write the withdrawal as an optimistic update: it only applies while the balance it expects is still the balance on the row. If not, report a conflict.
entry:
  methods:
    - {name: withdraw, params: [{name: id, type: "int"}, {name: amount, type: "double"}, {name: expectedBalance, type: "double"}], returns: "String"}
tests:
  visible:
    - {name: "a withdrawal that matches", method: withdraw, args: [1, 100.0, 1200.0], expect: "ok|1100.00"}
    - {name: "a withdrawal that drains the account", method: withdraw, args: [1, 1200.0, 1200.0], expect: "ok|0.00"}
    - {name: "a withdrawal from another account", method: withdraw, args: [2, 300.5, 300.5], expect: "ok|0.00"}
  hidden:
    - {name: "a stale expectation must conflict", method: withdraw, args: [1, 100.0, 1050.0], expect: "conflict|1050.00"}
    - {name: "an overdraft must not apply", method: withdraw, args: [3, 10.0, 0.0], expect: "conflict|0.00"}
    - {name: "an unknown account", method: withdraw, args: [99, 10.0, 10.0], expect: "conflict|10.00"}
    - {name: "a withdrawal that drains the account", method: withdraw, args: [4, 780.25, 780.25], expect: "ok|0.00"}
    - {name: "a withdrawal from the last account", method: withdraw, args: [5, 50.0, 50.0], expect: "ok|0.00"}
hints:
  h1: "What does the WHERE clause add that a plain UPDATE does not?"
  h2: "Write the expected balance in the WHERE clause, so the row must still match it."
ai_assisted: true
