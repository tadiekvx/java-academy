    - {name: "a valid write", method: violation, args: ["valid"], expect: "ok"}
  hidden:
    - {name: "a primary key that repeats", method: violation, args: ["duplicate-account"], expect: "23505"}
    - {name: "an operation that does not exist", method: violation, args: ["unknown"], expect: "unknown operation"}
    - {name: "a foreign key that points nowhere", method: violation, args: ["orphan-account"], expect: "23506"}
    - {name: "a balance below zero", method: violation, args: ["negative-balance"], expect: "23513"}
    - {name: "a valid write", method: violation, args: ["valid"], expect: "ok"}
hints:
  h1: "What SQLState does a foreign key violation return?"
  h2: "What SQLState does a check constraint return?"
