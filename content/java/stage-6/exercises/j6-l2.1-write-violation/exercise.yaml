evidence: [IMPL]
misconceptions: []
difficulty: 2
prompt: |
  Write the statement for the operation, and read the SQLState of a statement the database rejects. Know what each class of violation means.
entry:
  methods:
    - {name: violation, params: [{name: operation, type: "String"}], returns: "String"}
tests:
  visible:
    - {name: "a foreign key that points nowhere", method: violation, args: ["orphan-account"], expect: "23506"}
