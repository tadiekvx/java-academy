id: j6-l2.2-write-transfer
type: write
title: "One all-or-nothing transfer"
lesson: j6-l2.2
role: ladder
assesses: [o1]
concepts: [J6.06]
evidence: [IMPL]
misconceptions: []
difficulty: 3
prompt: |
  Write the transfer as a single transaction: debit the source account, credit the destination account, commit; if any statement fails, roll back and say so.
entry:
  methods:
    - {name: transfer, params: [{name: from, type: "int"}, {name: to, type: "int"}, {name: amount, type: "double"}], returns: "String"}
tests:
  visible:
    - {name: "a transfer between two open accounts", method: transfer, args: [1, 2, 100.0], expect: "1100.00|400.50"}
    - {name: "an overdraft is rejected", method: transfer, args: [3, 1, 10.0], expect: "23513"}
    - {name: "a transfer between two open accounts", method: transfer, args: [2, 1, 50.0], expect: "250.50|1250.00"}
  hidden:
    - {name: "a small transfer", method: transfer, args: [5, 4, 25.0], expect: "25.00|805.25"}
    - {name: "a transfer that drains an account", method: transfer, args: [2, 5, 300.5], expect: "0.00|350.50"}
    - {name: "a transfer that drains the source", method: transfer, args: [1, 2, 1200.0], expect: "0.00|1500.50"}
    - {name: "a transfer between two open accounts", method: transfer, args: [4, 3, 5.0], expect: "775.25|5.00"}
    - {name: "a small transfer", method: transfer, args: [5, 4, 50.0], expect: "0.00|830.25"}
hints:
  h1: "Turn auto-commit off before the first statement, and commit or roll back around them."
  h2: "Which side can break the balance?"
ai_assisted: true
